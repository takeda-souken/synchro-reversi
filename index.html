// ユーティリティ
function rrect(x,y,w,h,r){x.beginPath();x.moveTo(y+r,w);x.lineTo(y+h-r,w);x.quadraticCurveTo(y+h,w,y+h,w+r);x.lineTo(y+h,w+r-r);/* ... */}
// ↑ 上のrrectは壊れてるので正しく書き直す:
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function tt(ctx,t,x,y,f,c,a='center',b='middle',mw){ctx.font=f;ctx.fillStyle=c;ctx.textAlign=a;ctx.textBaseline=b;if(mw)ctx.fillText(t,x,y,mw);else ctx.fillText(t,x,y);}
function hit(tx,ty,x,y,w,h){return tx>=x&&tx<=x+w&&ty>=y&&ty<=y+h;}
function eo(t){return 1-Math.pow(1-t,3);}
// 溜めて→ストン着地（ease-in cubic、t=1で確実に1.0）
function eiFly(t){return t*t*(3-2*t);} // smoothstep: ゆっくり→加速→ゆっくり着地
// 戦況に応じた背景色を計算。ratio: 0=均衡, 正=黒優勢, 負=白優勢
// 背景色フェード用の現在値
const _bgCur=[42,42,46];
let _bgLogTimer=0;
function battleBg(bd,swap=false,final=false){
  if(!bd){_lerpBg(C.bgN);return _bgRgb();}
  const cn=bd.cnt();
  const placed=cn.b+cn.w;if(!placed){_lerpBg(C.bgN);return _bgRgb();}
  const aScore=swap?cn.w:cn.b, bScore=swap?cn.b:cn.w;
  const winner=aScore>=bScore?'a':'b';
  const diff=Math.abs(aScore-bScore);
  // 最終結果: 僅差でも勝者色にバーッと染まる
  const strength=final?1.0:Math.pow(Math.min(1,diff/15),0.6);
  const target=winner==='a'?C.bgA:C.bgB;
  // 引き分けはニュートラル
  const tgt=diff===0?C.bgN:target;
  const mix=(a,b2,t2)=>Math.round(a+(b2-a)*t2);
  const goal=[mix(C.bgN[0],tgt[0],strength),mix(C.bgN[1],tgt[1],strength),mix(C.bgN[2],tgt[2],strength)];
  // 最終結果はlerp速めに
  final?_lerpBg(goal,0.12):_lerpBg(goal);
  const now=performance.now();
  if(now-_bgLogTimer>1000){_bgLogTimer=now;
    console.log(`[BG] ●${cn.b} ◻${cn.e} ○${cn.w} | A:${aScore} B:${bScore} diff:${diff} str:${strength.toFixed(2)}${final?' FINAL':''} | bg:rgb(${Math.round(_bgCur[0])},${Math.round(_bgCur[1])},${Math.round(_bgCur[2])})`);}
  return _bgRgb();
}
function _lerpBg(goal,sp=0.15){for(let i=0;i<3;i++)_bgCur[i]+=(goal[i]-_bgCur[i])*sp;}
function _bgRgb(){return `rgb(${Math.round(_bgCur[0])},${Math.round(_bgCur[1])},${Math.round(_bgCur[2])})`;}

function pk(a){return a[Math.floor(Math.random()*a.length)];}
// ホバー/プレス判定ヘルパー
function isHov(x,y,w,h){const a=window._app;return a&&hit(a.hoverX,a.hoverY,x,y,w,h);}
function isPress(x,y,w,h){const a=window._app;return a&&a.pressing&&hit(a.hoverX,a.hoverY,x,y,w,h);}
// インタラクティブ要素の描画ヘルパー（背景ハイライト）
function hovFx(ctx,x,y,w,h){
  if(isPress(x,y,w,h)){ctx.fillStyle='rgba(255,255,255,0.15)';rr(ctx,x,y,w,h,4);ctx.fill();}
  else if(isHov(x,y,w,h)){ctx.fillStyle='rgba(255,255,255,0.08)';rr(ctx,x,y,w,h,4);ctx.fill();}
}

// レイアウト: max-width 480px でスマホ風にセンタリング
function L(W,H){
  // 画面の高さベースで拡大。縦が大きいほどコンテンツも大きく
  const eW=Math.min(W*0.92, H*0.75, 900);
  const mob=W<500;
  const fs=Math.max(Math.min(eW*0.048, H*0.032, 32), mob?22:14);
  return{eW,ox:(W-eW)/2,cx:W/2,fs,mob};
}

function drawBtn(ctx,label,x,y,w,h,color=C.gold,tc){
  const maxW=500;if(w>maxW){x+=(w-maxW)/2;w=maxW;}
  h=Math.max(h,36);
  // ホバー/プレス効果
  const app=window._app;
  const hovered=app&&hit(app.hoverX,app.hoverY,x,y,w,h);
  const pressed=hovered&&app.pressing;
  const yOff=pressed?2:hovered?-1:0;
  const bright=pressed?0.85:hovered?1.1:1;
  const i=h*0.06;ctx.beginPath();ctx.moveTo(x+i+3,y+yOff);ctx.lineTo(x+w-i-3,y+yOff);ctx.lineTo(x+w,y+h+yOff);ctx.lineTo(x,y+h+yOff);ctx.closePath();
  ctx.fillStyle=color;ctx.fill();
  if(hovered){ctx.fillStyle=`rgba(255,255,255,${pressed?0:0.1})`;ctx.fill();}
  ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1.5;ctx.stroke();
  if(!tc)tc=(color===C.gold)?'#1a1a1a':'#f0efe8';
  tt(ctx,label,x+w/2,y+h/2+1+yOff,`bold ${Math.floor(h*0.4)}px sans-serif`,tc);
}

// Board
class Board{
  constructor(){this.cells=Array.from({length:BS},()=>new Int8Array(BS));}
  clone(){const b=new Board();for(let r=0;r<BS;r++)b.cells[r]=new Int8Array(this.cells[r]);return b;}
  setup(n){for(let r=0;r<BS;r++)this.cells[r].fill(EMPTY);const l=n==='ランダム'?this._rnd():(LAYOUTS[n]||LAYOUTS['スタンダード']);for(const[r,c,v]of l)this.cells[r][c]=v;}
  _rnd(){const s=[],u=new Set(),n=2+Math.floor(Math.random()*3);for(let i=0;i<n;i++){let r,c,k;do{r=1+Math.floor(Math.random()*6);c=1+Math.floor(Math.random()*6);k=r*8+c;}while(u.has(k)||u.has((7-r)*8+(7-c)));u.add(k);u.add((7-r)*8+(7-c));s.push([r,c,BLACK]);s.push([7-r,7-c,WHITE]);}return s;}
  get(r,c){return this.cells[r][c];}
  inB(r,c){return r>=0&&r<BS&&c>=0&&c<BS;}
  flips(r,c,col){if(this.cells[r][c]!==EMPTY)return[];const op=col===BLACK?WHITE:BLACK,a=[];for(const[dr,dc]of DIRS){const f=[];let nr=r+dr,nc=c+dc;while(this.inB(nr,nc)&&this.cells[nr][nc]===op){f.push([nr,nc]);nr+=dr;nc+=dc;}if(f.length>0&&this.inB(nr,nc)&&this.cells[nr][nc]===col)a.push(...f);}return a;}

    this._isRescue=false;
    if(!m.length){
      // 自陣ゼロチェック: 自分の色の石が盤上にゼロなら、任意の石に隣接する空きマスに自由配置（角は可能な限り除外）
      let myCount=0;for(let r=0;r<BS;r++)for(let c=0;c<BS;c++)if(this.cells[r][c]===col)myCount++;
      const all=[],nonCorner=[];
      for(let r=0;r<BS;r++)for(let c=0;c<BS;c++){if(this.cells[r][c]!==EMPTY)continue;
        let adj=false;for(const[dr,dc]of DIRS){const nr=r+dr,nc=c+dc;if(this.inB(nr,nc)&&this.cells[nr][nc]!==EMPTY){adj=true;break;}}

  coopM(col){
    const solo=new Set(this.validM(col).map(([r,c])=>r*BS+c));
    const coop=new Set();
    const empties=[];
    for(let r=0;r<BS;r++)for(let c=0;c<BS;c++)if(this.cells[r][c]===EMPTY)empties.push([r,c]);
    // 相方が各空きマスに1石置いた場合をシミュレート
    for(const[ar,ac]of empties){
      const tmp=this.clone();tmp.cells[ar][ac]=col;
      for(const[r,c]of empties){
        if(r===ar&&c===ac)continue;
        const key=r*BS+c;
        if(solo.has(key)||coop.has(key))continue;
        if(tmp.cells[r][c]===EMPTY&&tmp.flips(r,c,col).length>0)coop.add(key);

  cnt(){let b=0,w=0,e=0;for(let r=0;r<BS;r++)for(let c=0;c<BS;c++){const v=this.cells[r][c];v===BLACK?b++:v===WHITE?w++:e++;}return{b,w,e};}
  isCorner(r,c){return(r===0||r===7)&&(c===0||c===7);}
  // 重み付きスコア
  wScore(){let bs=0,ws=0;for(let r=0;r<BS;r++)for(let c=0;c<BS;c++){const v=this.cells[r][c];if(!v)continue;let wt=1;const edge=r===0||r===7||c===0||c===7;const corner=(r===0||r===7)&&(c===0||c===7);if(corner)wt=5;else if(edge)wt=2;v===BLACK?bs+=wt:ws+=wt;}return{bs,ws};}
}

// CPU
class CPU{static pick(bd,col,m,pi=0){if(!m.length)return null;const p=CPERS[pi%CPERS.length];let best=-1e9,bm=[];for(const[r,c]of m){const f=bd.flips(r,c,col);let s=CPUW[r][c]*p.c+f.length*p.f+(Math.random()*p.r*2-p.r);if(s>best){best=s;bm=[[r,c]];}else if(Math.abs(s-best)<1.5)bm.push([r,c]);}return bm[Math.floor(Math.random()*bm.length)];}}

  // swap: trueの場合、左=白(チームA)、右=黒(チームB)
  splatBar(x,y,w,h,bd,final=false,swap=false){

}


// セリフv2: 手の評価関数
function evalMove(bd,r,c,col,otherR,otherC,coopBet){
  const isCorner=bd.isCorner(r,c);
  const tmp=new Board();for(let i=0;i<BS;i++)tmp.cells[i]=new Int8Array(bd.cells[i]);
  if(otherR!=null)tmp.cells[otherR][otherC]=col;
  const flips=tmp.flips(r,c,col).length;
  if(isCorner) return{grade:'CORNER',flips};
  if(coopBet&&flips===0) return{grade:'COOP_FAIL',flips};
  if(coopBet&&flips>0) return{grade:'COOP_OK',flips};
  if(flips>=3) return{grade:'BIG',flips};
  if(flips>0) return{grade:'NORMAL',flips};
  return{grade:'MISS',flips:0};
}
function comboCategory(g1,g2){
  const s=new Set([g1,g2]);
  if(s.has('CORNER')&&s.size===1) return 'BOTH_CORNER';
  if(s.has('CORNER')) return 'CORNER_GOOD';
  if(s.has('COOP_OK')) return 'COOP_SUCCESS';
  if(g1==='BIG'&&g2==='BIG') return 'BOTH_BIG';
  if(s.has('BIG')&&(s.has('NORMAL')||s.size===1)) return 'BIG_NORMAL';
  if((s.has('COOP_FAIL')||s.has('MISS'))&&(s.has('CORNER')||s.has('BIG'))) return 'GOOD_FAIL';
  if((s.has('COOP_FAIL')||s.has('MISS'))&&s.has('NORMAL')) return 'NORMAL_FAIL';
  if((s.has('COOP_FAIL')||s.has('MISS'))&&(s.has('COOP_FAIL')||s.has('MISS'))) return 'BOTH_FAIL';
  return 'BOTH_NORMAL';
}

function LSV2(){return LANG==='en'?SV2_EN:SV2;}

// TurnManager（フェーズ管理）
const PH={ST:'ST',TA:'TA',PR:'PR',PS:'PS',PC:'PC',HO:'HO',RV:'RV',AN:'AN',TE:'TE',GO:'GO',PA:'PA'};

class TM{
  constructor(ps,bd,spd=1,swap=false){
    this.ps=ps;this.bd=bd;this.spd=spd;this.swap=swap;this.ti=swap?1:0;this.pi=0;this.phase=PH.ST;
    this.p1=null;this.p2=null;this.vm=[];this.vmS=null;this.coopS=[];this.bS=null;
    this.cP=0;this.anims=[];this.animT=0;this.revT=0;
    this.msg='';this.sub='';this.bMsg='';this.bSub='';this.showB=true;this.sel=null;this.rev=null;this.dup=false;this.dupC=null;this._dupSeen=false;
    this.log=[];this.hist=[];this.bds=[];this.bubs=[];this.at=null;this.lastLine=null;
    this._usedD=new Set();this._usedN=new Set(); // セリフ重複防止用
    const c=bd.cnt();this.hist.push({b:c.b,w:c.w,e:c.e,ev:'開始',flips:0});this.bds.push(bd.clone());
    // 開始演出
    this.msg=T('gameStart');this.sub='';this.startMsg=true;
    this.auto(1000);
  }
  get team(){return this.ti===0?'A':'B';}
  get tCol(){const base=this.ti===0?BLACK:WHITE;return this.swap?(base===BLACK?WHITE:BLACK):base;}
  get tPs(){return this.ps.filter(p=>p.team===this.team);}
  // チーム別スコア（swap考慮）: A=先攻チームの石数, B=後攻チームの石数
  teamCnt(){const cn=this.bd.cnt();return this.swap?{a:cn.w,b:cn.b,e:cn.e}:{a:cn.b,b:cn.w,e:cn.e};}
  get cp(){return this.tPs[this.pi];}
  get allCPU(){return this.ps.every(p=>p.isCPU);}
  get turnNum(){return this.log.length;}

  auto(ms){if(this.at)clearTimeout(this.at);this.at=setTimeout(()=>this.tap(0,0,false),ms/this.spd);}

  startTurn(){this.bubs=[];
    this.bMsg='';this.bSub='';this.dupC=null;
    this.vm=this.bd.validM(this.tCol);this.isRescue=this.bd._isRescue||false;
    if(!this.vm.length){this.cP++;if(this.cP>=2||this.bd.cnt().e===0){this.goGameOver();return;}
      this.phase=PH.PA;this.msg=T('pass');this.sub='';this.showB=true;this.auto(this.spd>=8?80:600);return;}
    this.cP=0;this.bS=this.bd.clone();this.vmS=[...this.vm];
    this.coopS=this.bd.coopM(this.tCol); // 協力候補
    this.p1=null;this.p2=null;this.pi=0;this.sel=null;this.rev=null;this.dup=false;
    // チーム内2人が両方CPUなら、選択過程を飛ばして即リビール
    const tp=this.tPs;
    if(tp[0]?.isCPU&&tp[1]?.isCPU){
      this._cpuInstantPick();
      return;
    }
    if(this.allCPU){this.phase=PH.TA;this.msg='';this.showB=true;this.auto(300);}
    else{this.toReady();}
  }

  tap(r,c,isB){
    switch(this.phase){
      case PH.ST:this.startMsg=false;this.startTurn();break;
      case PH.TA:this.toReady();break;
      case PH.PR:if(this.cp?.isCPU)this.cpuPick();else{this.phase=PH.PS;this.msg=T('playOf',{name:this.cp.name});this.sub='';this.showB=true;}break;
      case PH.PS:if(!isB)return;{const allValid=[...this.vmS,...this.coopS];if(allValid.some(([vr,vc])=>vr===r&&vc===c)){this.sel=[r,c];this.phase=PH.PC;this.msg=T('confirmQ');this.sub=this.coopS.some(([vr,vc])=>vr===r&&vc===c)?T('coopWarn'):'';}}break;
      case PH.PC:if(isB){const allValid=[...this.vmS,...this.coopS];if(allValid.some(([vr,vc])=>vr===r&&vc===c)){this.sel=[r,c];this.sub=this.coopS.some(([vr,vc])=>vr===r&&vc===c)?T('coopWarn'):'';}}break;
      case PH.HO:{const cp2=this.cp;if(cp2){this.phase=PH.PS;this.msg=T('iPlayOf',{icon:cp2.icon,name:cp2.name});this.sub='';this.showB=true;}break;}
      case PH.TE:this.nextTeam();break;
      case PH.PA:this.nextTeam();break;
    }
  }
  toReady(){const cp=this.cp;if(!cp)return;
    if(cp.isCPU){this.phase=PH.PR;this.msg=T('iThinkingOf',{icon:cp.icon,name:cp.name});this.showB=true;setTimeout(()=>this.cpuPick(),(200+Math.random()*300)/this.spd);}
    else if(this.pi===0){
      this.phase=PH.PS;this.msg=T('iPlayOf',{icon:cp.icon,name:cp.name});this.sub='';this.showB=true;
    }else{
      // 2人目: 同チーム内に人間2人の時だけ渡し画面、それ以外はスキップ
      const tp=this.tPs;const humanInTeam=tp.filter(p=>!p.isCPU).length;
      if(humanInTeam>=2){
        this.phase=PH.HO;this.msg='';this.sub='';this.showB=false;
      }else{
        this.phase=PH.PS;this.msg=T('iPlayOf',{icon:cp.icon,name:cp.name});this.sub='';this.showB=true;
      }
    }}
  // チーム内2人が両方CPUの場合: まとめて1回の演出
  _cpuInstantPick(){
    this.showB=true;
    const tp=this.tPs;
    // 裏で即座に2人分pick
    this.pi=0;
    const pi1=this.ti*2;
    this.p1=CPU.pick(this.bS,this.tCol,this._cpuPool(pi1),pi1);
    this._p1Coop=this._coopBet;
    this.pi=1;
    const pi2b=this.ti*2+1;
    this.p2=CPU.pick(this.bS,this.tCol,this._cpuPool(pi2b),pi2b);
    this._p2Coop=this._coopBet;
    // 「考え中...」演出 → 短いウェイト後にリビール（x8はウェイトゼロ）
    this.phase=PH.PR;
    this.msg=T('teamThinking',{i1:tp[0].icon,i2:tp[1].icon});this.sub='';
    const thinkTime=this.spd>=8?0:Math.max(300,(800+Math.random()*400)/this.spd);
    if(thinkTime===0){this.doReveal();return;}
    setTimeout(()=>{
      this.msg=T('teamDecided',{i1:tp[0].icon,i2:tp[1].icon});
      setTimeout(()=>this.doReveal(),Math.max(100,300/this.spd));
    },thinkTime);
  }
  // CPU用のプール選択（協力候補の判定を含む）
  _cpuPool(pi2){
    let pool=this.vmS;this._coopBet=false;
    if(this.coopS&&this.coopS.length>0){
      const pers=CPERS[pi2%CPERS.length];
      const tc=this.teamCnt();const myScore=this.ti===0?tc.a:tc.b;const oppScore=this.ti===0?tc.b:tc.a;
      const losing=oppScore-myScore>8;const desperate=oppScore-myScore>15;const late=tc.e<20;
      let coopChance=0;
      if(pers.r>=10) coopChance=0.15;
      else if(pers.r>=5) coopChance=0.05;
      if(losing) coopChance+=0.15;
      if(desperate) coopChance+=0.25;
      if(late&&losing) coopChance+=0.2;
      if(Math.random()<coopChance){pool=[...this.vmS,...this.coopS];this._coopBet=true;}
    }
    return pool;
  }
  cpuPick(){const pi2=this.ti*2+this.pi;
    const pool=this._cpuPool(pi2);
    const mv=CPU.pick(this.bS,this.tCol,pool,pi2);
    if(this.pi===0){this.p1=mv;this._p1Coop=this._coopBet;this.pi=1;const np=this.tPs[1];if(np.isCPU){this.msg=T('thinkingOf',{name:np.name});setTimeout(()=>this.cpuPick(),(200+Math.random()*300)/this.spd);}
      else{
        // CPU→人間: 渡し画面不要（1人目がCPUなので見せる必要なし）
        this.phase=PH.PS;this.msg=T('iPlayOf',{icon:np.icon,name:np.name});this.sub='';this.showB=true;
      }}
    else{this.p2=mv;this._p2Coop=this._coopBet;this.doReveal();}}
  confirm(){if(!this.sel)return;if(this.pi===0){this.p1=this.sel;this.sel=null;this.pi=1;const np=this.tPs[1];if(np.isCPU){this.msg=T('thinkingOf',{name:np.name});this.showB=true;setTimeout(()=>this.cpuPick(),(300+Math.random()*300)/this.spd);}
      else{
        // 人間→人間: チーム内人間2人の時だけ渡し画面
        const humanInTeam=this.tPs.filter(p=>!p.isCPU).length;
        if(humanInTeam>=2){this.phase=PH.HO;this.msg='';this.sub='';this.showB=false;}
        else{this.phase=PH.PS;this.msg=T('iPlayOf',{icon:np.icon,name:np.name});this.sub='';this.showB=true;}
      }}
    else{this.p2=this.sel;this.sel=null;this.doReveal();}}
  cancel(){this.sel=null;this.phase=PH.PS;this.msg=T('playOf',{name:this.cp.name});this.sub='';}

  doReveal(){if(this.phase===PH.RV)return; // 二重発火防止
    this.phase=PH.RV;this.showB=true;
    const d=this.p1[0]===this.p2[0]&&this.p1[1]===this.p2[1];this.dup=d;
    const tp=this.tPs;
    this.rev=[{cell:this.p1,icon:tp[0].icon}];
    if(!d)this.rev.push({cell:this.p2,icon:tp[1].icon});
    this.dupC=d?{i1:tp[0].icon,i2:tp[1].icon,cell:this.p1}:null;
    // セリフv2: 二人の手の組み合わせで分岐（全員喋る）
    this.bubs=[];
    {
      let pair;
      const tc2=this.teamCnt();const diff=tc2.a-tc2.b;
      const isLosing=(this.ti===0&&diff<-10)||(this.ti===1&&diff>10);
      const isWinning=(this.ti===0&&diff>10)||(this.ti===1&&diff<-10);
      const isLate=tc2.e<20;
      const baseDelay=d?1800:1000;
      if(d&&this.turnNum<=1) pair=pk(LSI().earlyDupe);
      else if(isLate&&isWinning) pair=pk(LSI().winning);
      else if(isLate&&isLosing) pair=pk(LSI().losing);
      else if(isLate) pair=pk(LSI().lateGame);
      else if(d){
        pair=pk(LDUP_WE());
        const oppTeam=this.team==='A'?'B':'A';
        const oppPs=this.ps.filter(p=>p.team===oppTeam);
        const oppPair=pk(LDUP_THEY());
        if(oppPs.length>=2){
          this.bubs.push({icon:oppPs[0].icon,text:oppPair[0],corner:this.ps.indexOf(oppPs[0]),delay:baseDelay+600});
          this.bubs.push({icon:oppPs[1].icon,text:oppPair[1],corner:this.ps.indexOf(oppPs[1]),delay:baseDelay+900});
        }
      }else{
        const e1=evalMove(this.bS,this.p1[0],this.p1[1],this.tCol,this.p2[0],this.p2[1],this._p1Coop);
        const e2=evalMove(this.bS,this.p2[0],this.p2[1],this.tCol,this.p1[0],this.p1[1],this._p2Coop);
        const cat=comboCategory(e1.grade,e2.grade);
        pair=pk(LSV2()[cat]||LSV2().BOTH_NORMAL);
      }
      if(!pair) pair=pk(LSV2().BOTH_NORMAL);
      this.lastLine=pair;
      this.bubs.push({icon:tp[0].icon,text:pair[0],corner:this.ps.indexOf(tp[0]),delay:baseDelay});
      this.bubs.push({icon:tp[1].icon,text:pair[1],corner:this.ps.indexOf(tp[1]),delay:baseDelay+300});
    }
    this.bMsg=d?T('crashed'):T('opened');
    this.bSub=d?(this._dupSeen?'':T('crashedSub')):T('openedSub');if(d)this._dupSeen=true;
    this.msg='';this.sub='';
    // 飛行軌道のランダムパラメータ
    this.flyCurve1=(Math.random()-0.5)*200;
    this.flyCurve2=(Math.random()-0.5)*200;
    // フェイント: 30%の確率で別の候補マスに向かってから急旋回
    const vm=this.vmS||[];
    this.flyFeint1=null;this.flyFeint2=null;
    if(vm.length>2&&Math.random()<0.3){
      const others1=vm.filter(([r,c])=>!(r===this.p1[0]&&c===this.p1[1]));
      if(others1.length)this.flyFeint1=pk(others1);
    }
    if(!d&&vm.length>2&&Math.random()<0.3){
      const others2=vm.filter(([r,c])=>!(r===this.p2[0]&&c===this.p2[1]));
      if(others2.length)this.flyFeint2=pk(others2);
    }
    this.revT=performance.now();
  }

  execPlace(){
    this.phase=PH.AN;this.anims=[];this.showB=true;const col=this.tCol;const now=performance.now();
    const opp=col===BLACK?WHITE:BLACK;
    const[r1,c1]=this.p1;

    const justPlace=(r,c,delay)=>{
      this.bd.cells[r][c]=col;
      this.anims.push({type:'place',r,c,color:col,progress:0,startTime:now+delay});
    };
    // 重複防止: 既にフリップ演出が登録されたマスを記録
    const flippedSet=new Set();
    // 五月雨フリップ: 置いた石から近い順にディレイ（ヒットストップ150ms後に開始）
    const cascadeFlips=(flips,pr,pc,baseDelay)=>{
      const hitStop=150;
      const perStone=60;
      const sorted=[...flips].sort((a,b)=>{
        const da=Math.abs(a[0]-pr)+Math.abs(a[1]-pc);
        const db=Math.abs(b[0]-pr)+Math.abs(b[1]-pc);
        return da-db;
      });
      let count=0;
      for(const[fr,fc]of sorted){
        const key=fr*BS+fc;
        if(flippedSet.has(key))continue; // 重複スキップ
        flippedSet.add(key);
        this.anims.push({type:'flip',r:fr,c:fc,from:opp,to:col,progress:0,startTime:now+baseDelay+hitStop+count*perStone});
        count++;
      }
      return hitStop+count*perStone+350;
    };

    if(this.dup){
      const f=this.bd.flips(r1,c1,col);
      if(f.length>0){
        this.bd.place(r1,c1,col);
        this.anims.push({type:'place',r:r1,c:c1,color:col,progress:0,startTime:now});
        cascadeFlips(f,r1,c1,0);
      }else if(this.vmS.some(([vr,vc])=>vr===r1&&vc===c1)){
        justPlace(r1,c1,0);
      }else{
        this.anims.push({type:'miss',r:r1,c:c1,progress:0,startTime:now});
      }
    }else{
      const[r2,c2]=this.p2;
      const checkFlips=(bd,r,c,col2,otherR,otherC)=>{
        const tmp=new Board();for(let i=0;i<BS;i++)tmp.cells[i]=new Int8Array(bd.cells[i]);
        tmp.cells[r][c]=EMPTY;
        tmp.cells[otherR][otherC]=col2;
        return tmp.flips(r,c,col2);
      };
      const f1=checkFlips(this.bd,r1,c1,col,r2,c2);
      const f2=checkFlips(this.bd,r2,c2,col,r1,c1);

      let delay=0;
      if(f1.length>0){
        this.bd.place(r1,c1,col);
        this.anims.push({type:'place',r:r1,c:c1,color:col,progress:0,startTime:now});
        delay=cascadeFlips(f1,r1,c1,0);
      }else if(this.vmS.some(([vr,vc])=>vr===r1&&vc===c1)){
        justPlace(r1,c1,0);delay=400;
      }else{
        this.anims.push({type:'miss',r:r1,c:c1,progress:0,startTime:now});delay=400;
      }
      if(f2.length>0){
        if(this.bd.cells[r2][c2]===EMPTY)this.bd.place(r2,c2,col);
        this.anims.push({type:'place',r:r2,c:c2,color:col,progress:0,startTime:now+delay});
        for(const[fr,fc]of f2){if(this.bd.cells[fr][fc]!==col)this.bd.cells[fr][fc]=col;}
        cascadeFlips(f2,r2,c2,delay);
      }else if(this.vmS.some(([vr,vc])=>vr===r2&&vc===c2)){
        justPlace(r2,c2,delay);
      }else{
        this.anims.push({type:'miss',r:r2,c:c2,progress:0,startTime:now+delay});
      }
    }
    this.animT=now;this.rev=null;
    const tp=this.tPs,cn=this.bd.cnt();
    // フリップ数を集計（flip系animの数）
    const flipCount=this.anims.filter(a=>a.type==='flip').length;
    let ev=tp[0]?.icon||'';if(this.dup)ev+=' かぶり';
    // 角判定: 実際に角に石が置けた場合のみ（missは除外）
    const col2=this.tCol;
    const gotCorner=(this.bd.isCorner(r1,c1)&&this.bd.get(r1,c1)===col2)||(!this.dup&&this.bd.isCorner(this.p2[0],this.p2[1])&&this.bd.get(this.p2[0],this.p2[1])===col2);
    if(gotCorner)ev+=' 🏴角';
    this.log.push({team:this.team,p1:tp[0].name,p1c:this.p1,p2:tp[1].name,p2c:this.p2,dup:this.dup,flips:flipCount});
    this.hist.push({b:cn.b,w:cn.w,e:cn.e,ev,flips:flipCount,team:this.team});this.bds.push(this.bd.clone());
    // リアクションセリフ: 大量フリップ or 協力候補成功
    const oppTeam=this.team==='A'?'B':'A';
    const oppPs=this.ps.filter(p=>p.team===oppTeam);
    const anyCoopSuccess=!this.dup&&(this._p1Coop||this._p2Coop)&&flipCount>0;
    if(anyCoopSuccess){
      const pair=pk(LSI().coopSuccess);
      this.bubs=[{icon:tp[0].icon,text:pair[0],corner:this.ps.indexOf(tp[0])},{icon:tp[1].icon,text:pair[1],corner:this.ps.indexOf(tp[1]),delay:200}];
      this.revT=now;
    }else if(flipCount>=5){
      const pair=pk(LSI().bigFlip);const vpair=pk(LSI().bigFlipVic);
      this.bubs=[
        {icon:tp[0].icon,text:pair[0],corner:this.ps.indexOf(tp[0])},
        {icon:tp[1].icon,text:pair[1],corner:this.ps.indexOf(tp[1]),delay:200},
        {icon:oppPs[0]?.icon,text:vpair[0],corner:this.ps.indexOf(oppPs[0]),delay:500},
        {icon:oppPs[1]?.icon,text:vpair[1],corner:this.ps.indexOf(oppPs[1]),delay:700},
      ];
      this.revT=now;
    }
  }
  updateAnim(now){if(this.phase!==PH.AN)return;let done=true;
    for(const a of this.anims){const el=now-a.startTime;const dur=a.type==='place'?250:a.type==='miss'?900:350;a.progress=Math.min(1,Math.max(0,el/dur));if(a.progress<1)done=false;}
    const wait=this.spd>=8?80:600/Math.max(1,this.spd);
    if(done&&now-this.animT>wait){this.anims=[];const cn=this.bd.cnt();
      if(cn.e===0){this.goGameOver();return;}
      const nc=this.ti===0?WHITE:BLACK;if(!this.bd.validM(nc).length&&!this.bd.validM(this.tCol).length){this.goGameOver();return;}
      this.phase=PH.TE;this.msg='';this.sub='';
      this.auto(this.spd>=8?80:800);}}
  goGameOver(){
    this.phase=PH.GO;
    // 勝敗セリフ: 4人それぞれに台詞を割り当て
    const tc=this.teamCnt();const winner=tc.a>tc.b?'A':tc.b>tc.a?'B':null;
    if(winner){
      const diff=Math.abs(tc.a-tc.b);
      const line=diff<=4?pk(LEC()):pk(LEN());
      const wPs=this.ps.filter(p=>p.team===winner);
      const lPs=this.ps.filter(p=>p.team!==winner);
      this.bubs=[
        {icon:wPs[0]?.icon,text:line[0],corner:this.ps.indexOf(wPs[0])},
        {icon:wPs[1]?.icon,text:line[1],corner:this.ps.indexOf(wPs[1]),delay:300},
        {icon:lPs[0]?.icon,text:line[2],corner:this.ps.indexOf(lPs[0]),delay:600},
        {icon:lPs[1]?.icon,text:line[3],corner:this.ps.indexOf(lPs[1]),delay:900},
      ];
      this.revT=performance.now();
    }
  }
  nextTeam(){this.ti=1-this.ti;this.startTurn();}
}

// §7 TitleScreen
class TitleScreen{
  constructor(app,prev){

  _mk(){const a=PRESETS[this.pA],b=PRESETS[this.pB];const ni=LANG==='en'?5:3;return[{name:a[ni],team:'A',isCPU:false,icon:a[1]},{name:a[ni+1],team:'A',isCPU:true,icon:a[2]},{name:b[ni],team:'B',isCPU:true,icon:b[1]},{name:b[ni+1],team:'B',isCPU:true,icon:b[2]}];}
  _upd(){
    const a=PRESETS[this.pA],b=PRESETS[this.pB];const ni=LANG==='en'?5:3;
    this.ps[0].icon=a[1];if(!this.ps[0].custom)this.ps[0].name=a[ni];
    this.ps[1].icon=a[2];if(!this.ps[1].custom)this.ps[1].name=a[ni+1];
    this.ps[2].icon=b[1];if(!this.ps[2].custom)this.ps[2].name=b[ni];
    this.ps[3].icon=b[2];if(!this.ps[3].custom)this.ps[3].name=b[ni+1];
  }
  _resetNames(){
    const a=PRESETS[this.pA],b=PRESETS[this.pB];
    this.ps[0].name=a[3];this.ps[0].custom=false;
    this.ps[1].name=a[4];this.ps[1].custom=false;
    this.ps[2].name=b[3];this.ps[2].custom=false;
    this.ps[3].name=b[4];this.ps[3].custom=false;
  }

  draw(ctx,W,H){
    const lw=this.app.lastWinStone;
    if(lw===null||lw===undefined){
      // 初回: 白黒往復
      const t=(Math.sin(performance.now()/2000)+1)/2;
      const mix=(a,b,r)=>Math.round(a+(b-a)*r);
      ctx.fillStyle=`rgb(${mix(C.bgA[0],C.bgB[0],t)},${mix(C.bgA[1],C.bgB[1],t)},${mix(C.bgA[2],C.bgB[2],t)})`;
    }else{
      // 2回目以降: 前回勝者の色
      const tgt=lw===BLACK?C.bgA:C.bgB;
      _lerpBg(tgt);ctx.fillStyle=_bgRgb();
    }
    ctx.fillRect(0,0,W,H);this.btns=[];
    const{eW,ox,cx,fs}=L(W,H);
    // テキスト色を背景の明暗に合わせてフェード
    const lw2=this.app.lastWinStone;
    const bgT=lw2===undefined||lw2===null?(Math.sin(performance.now()/2000)+1)/2:(_bgCur[0]+_bgCur[1]+_bgCur[2])/720;
    const fm2=Math.round(240-(240-26)*bgT);
    const fgMain=`rgb(${fm2},${fm2},${fm2})`;
    const fgSub=`rgba(${fm2},${fm2},${fm2},0.5)`;
    const ch=this._ch||0;
    let y0=ch>0?Math.max(fs*0.3,(H-ch)/2):fs*0.5;
    let y=y0;

    tt(ctx,'Synchronized',cx,y,`bold ${fs*1.2}px sans-serif`,C.gold);y+=fs*1.5;

    tt(ctx,T('subtitle'),cx,y,`${fs*0.55}px sans-serif`,fgSub);
    // 言語切替ボタン（サブタイトル右）

    tt(ctx,LANG==='ja'?'EN':'JA',langBtnX+langBtnW/2,langBtnY+langBtnH/2,`${lnH2?'bold ':''}${fs*0.5}px sans-serif`,lnH2?C.gold:fgSub);

    // 先攻/後攻: アイコン固定（左A右B）、swapで石色と先攻後攻が入れ替わる
    const stoneR=fs*0.45;
    const preA=PRESETS[this.pA],preB=PRESETS[this.pB];
    const aLabel=this.swap?T('secondTurn'):T('firstTurn'), bLabel=this.swap?T('firstTurn'):T('secondTurn');
    const aStone=this.swap?WHITE:BLACK, bStone=this.swap?BLACK:WHITE;
    tt(ctx,aLabel,cx-fs*3.2,y+fs*0.4,`${fs*0.5}px sans-serif`,fgSub);
    tt(ctx,preA[0],cx-fs*2.2,y+fs*0.4,`${fs*0.6}px sans-serif`,fgMain);
    this.ren.stone(cx-fs*1.3,y+fs*0.4,stoneR,aStone);
    const swpBx=cx-fs*1.5,swpBy=y,swpBw=fs*3,swpBh=fs*1;
    hovFx(ctx,swpBx,swpBy,swpBw,swpBh);
    const swH=isHov(swpBx,swpBy,swpBw,swpBh);
    tt(ctx,'⇄',cx,y+fs*0.4,`${swH?'bold ':''}${fs*(swH?0.65:0.55)}px sans-serif`,swH?fgMain:C.gold);
    this.ren.stone(cx+fs*1.3,y+fs*0.4,stoneR,bStone);
    tt(ctx,preB[0],cx+fs*2.2,y+fs*0.4,`${fs*0.6}px sans-serif`,fgMain);
    tt(ctx,bLabel,cx+fs*3.2,y+fs*0.4,`${fs*0.5}px sans-serif`,fgSub);
    this.btns.push({id:'swap',x:swpBx,y:swpBy,w:swpBw,h:swpBh});

    // チーム設定（横並び、max-width内）
    const gap=eW*0.04,bw=(eW-gap)/2;
    const bxA=ox,bxB=ox+bw+gap,bh=fs*5;
    // 石色ペアリング: A黒→赤, A白→青（swapで入れ替わる）
    const colA=this.swap?C.tB:C.tA, bgA2=this.swap?C.tBBg:C.tABg;
    const colB=this.swap?C.tA:C.tB, bgB2=this.swap?C.tABg:C.tBBg;
    this._teamBox(ctx,bxA,y,bw,bh,this.pA,'A',colA,bgA2,0,fs);
    this._teamBox(ctx,bxB,y,bw,bh,this.pB,'B',colB,bgB2,2,fs);
    y+=bh+fs*1.2;

    // 初期配置プレビュー
    tt(ctx,T('layout'),cx,y,`${fs*0.5}px sans-serif`,fgSub);y+=fs*0.8;
    const maxPH=H*0.13;const pSz=Math.min((eW-16)/LKEYS.length-6,fs*2.8,maxPH);
    const tW=LKEYS.length*(pSz+6)-6;let px=cx-tW/2;
    for(let i=0;i<LKEYS.length;i++){
      const k=LKEYS[i],lay=k==='ランダム'?null:LAYOUTS[k];
      if(i===this.li){rr(ctx,px-3,y-3,pSz+6,pSz+6+fs*0.8,4);ctx.fillStyle=C.hi;ctx.fill();}
      if(!lay){rr(ctx,px-2,y-2,pSz+4,pSz+4,3);ctx.fillStyle=C.boardBg;ctx.fill();tt(ctx,'🎲',px+pSz/2,y+pSz/2,`${pSz*0.4}px sans-serif`,C.txt);}
      else this.ren.mini(lay,px,y,pSz);
      tt(ctx,T(k),px+pSz/2,y+pSz+fs*0.4,`${fs*0.5}px sans-serif`,i===this.li?C.gold:C.sub);
      this.btns.push({id:`l_${i}`,x:px-3,y:y-3,w:pSz+6,h:pSz+6+fs*0.8});
      px+=pSz+6;
    }
    y+=pSz+fs*1.8;

    // 観戦速度
    const sLbl=['×0.5','×1','×2','×4','×8'],sVal=[0.5,1,2,4,8];
    const swT=Math.min(eW*0.8,fs*10),sw=swT/sVal.length,sx2=cx-swT/2;
    tt(ctx,T('speed'),cx,y,`${fs*0.5}px sans-serif`,fgSub);y+=fs*0.7;
    for(let i=0;i<sVal.length;i++){
      const act=this.spd===sVal[i];
      const sbx=sx2+i*sw+1,sby=y,sbw=sw-2,sbh=fs*0.9;
      rr(ctx,sbx,sby,sbw,sbh,4);
      ctx.fillStyle=act?C.gold:'rgba(255,255,255,0.08)';ctx.fill();
      hovFx(ctx,sbx,sby,sbw,sbh);
      tt(ctx,sLbl[i],sx2+i*sw+sw/2,y+fs*0.45,`${act?'bold ':''}${fs*0.5}px sans-serif`,act?'#1a1a1a':C.sub);
      this.btns.push({id:`s_${i}`,x:sx2+i*sw,y:y,w:sw,h:fs*0.9});
    }
    y+=fs*1.8;

    // スタート
    const btnH=Math.max(fs*2,H*0.05),btnW=Math.min(eW*0.6,260);
    const btnY=Math.min(y,H-btnH-H*0.03);

    this.btns.push({id:'go',x:cx-btnW/2,y:btnY,w:btnW,h:btnH});
    // ❓ヘルプボタン（右上）ON/OFF状態表示
    const tutOn=!window._tutSeen;
    const hx=W-fs*2,hy=fs*0.3,hw=fs*1.5,hh=fs*1.2;

    hovFx(ctx,hx,hy,hw,hh);
    const helpCol=tutOn?(hHov?C.gold:'#e05040'):(hHov?fgMain:'rgba(128,128,128,0.4)');
    tt(ctx,T('tutHelp'),hx+hw/2,hy+hh/2,`${hHov?'bold ':''}${fs*0.7}px sans-serif`,helpCol);
    // ホバー中のみ説明テキスト
    if(hHov){
      const tipMsg=tutOn?T('tutHelpOn'):T('tutHelpOff');
      const tipLines=tipMsg.split('\n');
      const app=window._app;const mx=app?app.hoverX:hx;const my=app?app.hoverY:hy+hh;
      for(let i=0;i<tipLines.length;i++){
        tt(ctx,tipLines[i],Math.min(mx,W-fs*5),my+hh+fs*0.3+i*fs*0.55,`${fs*0.5}px sans-serif`,fgMain,'center','top');
      }

    this.btns.push({id:'help',x:hx,y:hy,w:hw,h:hh});

  _teamBox(ctx,x,y,w,h,preIdx,team,color,bg,si,fs){
    const pre=PRESETS[preIdx];
    rr(ctx,x,y,w,h,8);ctx.fillStyle=bg;ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke();
    // チームアイコン＋左右ボタン
    const iy=y+fs*0.5;
    const iconX=x+w/2;
    tt(ctx,pre[0],iconX,iy,`${fs*0.85}px sans-serif`,color);
    // ◀▶ with hover
    const lx=iconX-fs*1.5,rx=iconX+fs*0.5,aw=fs*1,ah=fs*0.8;
    hovFx(ctx,lx,iy-fs*0.4,aw,ah);hovFx(ctx,rx,iy-fs*0.4,aw,ah);
    tt(ctx,'◀',iconX-fs*1,iy,`${isHov(lx,iy-fs*0.4,aw,ah)?'bold ':''}${fs*0.5}px sans-serif`,isHov(lx,iy-fs*0.4,aw,ah)?C.txt:C.gold);
    tt(ctx,'▶',iconX+fs*1,iy,`${isHov(rx,iy-fs*0.4,aw,ah)?'bold ':''}${fs*0.5}px sans-serif`,isHov(rx,iy-fs*0.4,aw,ah)?C.txt:C.gold);
    this.btns.push({id:`tL_${team}`,x:lx,y:iy-fs*0.4,w:aw,h:ah});
    this.btns.push({id:`tR_${team}`,x:rx,y:iy-fs*0.4,w:aw,h:ah});
    // プレイヤー
    for(let i=0;i<2;i++){
      const pi=si+i,ps=this.ps[pi];
      const ry=y+fs*1.4+i*(fs*1.6);
      // アイコン大きく
      tt(ctx,ps.icon,x+fs*0.8,ry+fs*0.55,`${fs*0.8}px sans-serif`,C.txt,'left');
      // 名前大きく
      tt(ctx,ps.name,x+fs*2,ry+fs*0.55,`${fs*0.55}px sans-serif`,C.txt,'left');
      this.btns.push({id:`n_${pi}`,x:x,y:ry,w:w*0.6,h:fs*1.2});
      // CPUボタン（右端からパディング）
      const lbl=ps.isCPU?'CPU':'人間';const tw=fs*2.4,tx=x+w-tw-fs*0.5,ty2=ry+fs*0.08,th=fs*0.95;
      rr(ctx,tx,ty2,tw,th,5);ctx.fillStyle=ps.isCPU?'rgba(78,168,196,0.45)':'rgba(224,80,64,0.35)';ctx.fill();
      hovFx(ctx,tx,ty2,tw,th);
      tt(ctx,lbl,tx+tw/2,ry+fs*0.55,`bold ${fs*0.55}px sans-serif`,C.txt);
      this.btns.push({id:`t_${pi}`,x:tx,y:ry,w:tw,h:fs*1});
    }
  }

  handleTap(tx,ty){
    for(const b of this.btns){if(!hit(tx,ty,b.x,b.y,b.w,b.h))continue;
      if(b.id==='go')this.app.startGame(this.ps,LKEYS[this.li],this.swap,this.spd);
      else if(b.id==='help'){window._tutSeen=!window._tutSeen;}
      else if(b.id==='lang'){LANG=LANG==='ja'?'en':'ja';this._upd();}
      else if(b.id==='swap')this.swap=!this.swap;
      else if(b.id.startsWith('l_'))this.li=parseInt(b.id.substring(2));
      else if(b.id.startsWith('t_')&&!b.id.startsWith('tL')&&!b.id.startsWith('tR')){const i=parseInt(b.id.substring(2));this.ps[i].isCPU=!this.ps[i].isCPU;}
      else if(b.id.startsWith('s_')){const sVal=[0.5,1,2,4,8];this.spd=sVal[parseInt(b.id.substring(2))];}
      else if(b.id==='tL_A'){this.pA=this._nextPre(this.pA,-1,this.pB);this._upd();}
      else if(b.id==='tR_A'){this.pA=this._nextPre(this.pA,1,this.pB);this._upd();}
      else if(b.id==='tL_B'){this.pB=this._nextPre(this.pB,-1,this.pA);this._upd();}
      else if(b.id==='tR_B'){this.pB=this._nextPre(this.pB,1,this.pA);this._upd();}
      else if(b.id.startsWith('n_')){const i=parseInt(b.id.substring(2));const def=i<2?PRESETS[this.pA][3+i]:PRESETS[this.pB][3+i-2];const n=prompt(`${this.ps[i].icon} の名前:\n（空欄でデフォルト「${def}」に戻す）`,this.ps[i].name);if(n===null){}else if(!n.trim()){this.ps[i].name=def;this.ps[i].custom=false;}else{this.ps[i].name=n.trim();this.ps[i].custom=true;}}
      return;
    }
  }
  // 相手プリセットをスキップして循環
  _nextPre(cur,dir,other){let n=(cur+dir+PRESETS.length)%PRESETS.length;while(n===other)n=(n+dir+PRESETS.length)%PRESETS.length;return n;}
}

// §8 GameScreen — 麻雀式4隅プレイヤーUI
class GameScreen{
  constructor(app,ps,layout,spd,swap=false){
    this.app=app;this.ren=new R(app.ctx);this.bd=new Board();this.bd.setup(layout);
    this.tm=new TM(ps,this.bd,spd,swap);this.btns=[];this.ox=0;this.oy=0;this.cs=0;this.shakeT=0;this.vicT=0;
    // チュートリアル（初回のみ）
    this.tut={show:!window._tutSeen,msg:null,t:0,intro:false,playShown:false,coopSeen:false,dupSeen:false,rescueSeen:false,spots:null};
    // 初回チュートリアル: ゲーム開始前に即座にセット
    if(this.tut.show){this.tut.msg='tut1';this.tut.t=performance.now();this.tut.intro=true;}
    // 4隅プレイヤー位置キャッシュ
    this.pPos=[]; // [{x,y,w,h}] for each player
    // 石飛行アニメ
    this.flyAnims=[];
  }

  // プレイヤーの4隅位置を計算
  _calcPlayerPos(W,H,fs){
    const bSz=this.cs*BS;const mob=W<500;
    if(mob){
      const pw=fs*2.6,ph=fs*2.6;
      const topY=this.oy-ph-fs*0.3,botY=this.oy+bSz+fs*0.3;
      this.pPos=[{x:this.ox,y:topY},{x:this.ox,y:botY},{x:this.ox+bSz-pw,y:topY},{x:this.ox+bSz-pw,y:botY}];
      return{pw,ph};
    }else{
      const pad=fs*0.7,pw=fs*3.2,ph=fs*3;
      const bx1=this.ox-pw-pad,bx2=this.ox+bSz+pad;
      const by1=this.oy-fs*0.5,by2=this.oy+bSz-ph+fs*0.5;
      this.pPos=[{x:bx1,y:by1},{x:bx1,y:by2},{x:bx2,y:by1},{x:bx2,y:by2}];
      return{pw,ph};
    }
  }

  // プレイヤーパネル: アイコン→改行→名前（中央寄せ）
  _drawPlayer(ctx,p,pos,pw,ph,fs,isActive,iCol,isYou=false,stoneCol=BLACK,isTeamTurn=false,isDone=false){
    // 「あなた」ラベル（パネルの上）
    const isBot=pos.y>this.oy+this.cs*BS/2;if(isYou){const isTurn=this.tm&&this.tm.cp===p;const lbl=isTurn?T('yourTurn'):T('youLabel');tt(ctx,lbl,pos.x+pw/2,isBot?pos.y+ph+fs*0.55:pos.y-fs*0.45,`bold ${fs*0.55}px sans-serif`,isTurn?'#ffcc44':C.gold);}
    const isBlack=stoneCol===BLACK;
    // 3段階: アクティブ > チームの番 > 非アクティブ
    const bgNorm=isBlack?'rgba(20,20,20,0.3)':'rgba(240,239,232,0.5)';
    const bgTeam=isBlack?'rgba(30,20,18,0.5)':'rgba(242,241,236,0.75)';
    const bgAct=isBlack?'rgba(50,20,18,0.65)':'rgba(245,244,238,0.92)';
    rr(ctx,pos.x,pos.y,pw,ph,8);
    ctx.fillStyle=isActive?bgAct:isTeamTurn?bgTeam:bgNorm;ctx.fill();
    if(isActive){
      ctx.shadowColor=iCol;ctx.shadowBlur=12;
      ctx.strokeStyle=iCol;ctx.lineWidth=2.5;ctx.stroke();
      ctx.shadowBlur=0;
    }else if(isTeamTurn){
      ctx.strokeStyle=iCol;ctx.lineWidth=1.5;ctx.stroke();
    }else{
      ctx.strokeStyle=isBlack?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.1)';ctx.lineWidth=1;ctx.stroke();
    }
    tt(ctx,p.icon,pos.x+pw/2,pos.y+ph*0.35,`${fs*1.2}px sans-serif`,C.txt);
    const name=p.name.length>5?p.name.substring(0,5)+'…':p.name;
    const nameCol=isBlack?((isActive||isTeamTurn)?C.txt:C.sub):((isActive||isTeamTurn)?'#1a1a1a':'#3a3a3a');
    tt(ctx,name,pos.x+pw/2,pos.y+ph*0.78,`${fs*0.5}px sans-serif`,nameCol);
    // 選択完了マーク
    if(isDone){
      tt(ctx,'✓',pos.x+pw-fs*0.4,pos.y+fs*0.4,`bold ${fs*0.5}px sans-serif`,'#2d9e5f');
    }
  }

  // 石が角から飛んでくるアニメを開始
  startFlyAnim(playerIdx,targetR,targetC,color,delay=0){
    this.flyAnims.push({pi:playerIdx,tr:targetR,tc:targetC,color,startTime:performance.now()+delay,duration:400,done:false});
  }

  draw(ctx,W,H){
    const isFinal=this.tm.phase===PH.GO;
    ctx.fillStyle=battleBg(this.bd,this.tm.swap,isFinal);ctx.fillRect(0,0,W,H);this.btns=[];
    const{eW,ox:lox,cx,fs}=L(W,H);
    const mob=W<500;
    const cn=this.bd.cnt();const ph=this.tm.phase;
    const iCol=this.tm.tCol===BLACK?C.tA:C.tB;
    const isBlackTurn=this.tm.tCol===BLACK;
    let topH,barH,ppW,ppH;

    if(mob){
      // === モバイル: 縦積みレイアウト ===
      // Row 1: ホーム + 速度
      const ctrlH=fs*1.2;
      const hmX=4,hmY=4,hmW=fs*1.5,hmH=ctrlH;
      hovFx(ctx,hmX,hmY,hmW,hmH);
      tt(ctx,'🏠',hmX+hmW/2,hmY+hmH/2,`${fs*(isHov(hmX,hmY,hmW,hmH)?0.7:0.6)}px sans-serif`,isHov(hmX,hmY,hmW,hmH)?'rgba(255,255,255,0.95)':'rgba(255,255,255,0.7)');
      this.btns.push({id:'home',x:hmX,y:hmY,w:hmW,h:hmH});
      const spdX=W-fs*2-4,spdY=4;const spW=fs*1.8,spH=ctrlH;
      rr(ctx,spdX,spdY,spW,spH,5);ctx.fillStyle=C.pan;ctx.fill();hovFx(ctx,spdX,spdY,spW,spH);
      const spdTxt=this.tm.spd>=8?'⚡':`×${this.tm.spd}`;
      tt(ctx,spdTxt,spdX+spW/2,spdY+spH/2,`bold ${fs*0.5}px sans-serif`,isHov(spdX,spdY,spW,spH)?C.txt:C.gold);
      this.btns.push({id:'spd',x:spdX,y:spdY,w:spW,h:spH});
      // Row 2: スプラバー
      barH=fs*1.5;const barY=ctrlH+6;const numPad=barH*1.0;
      this.ren.splatBar(lox+numPad,barY,eW-numPad*2,barH,this.bd,false,this.tm.swap);
      // Row 3: ターンインジケーター
      const turnY=barY+barH+2;
      if(isBlackTurn){ctx.fillStyle='#1a1a1a';ctx.fillRect(0,turnY,W,6);ctx.fillStyle=C.tA;ctx.fillRect(0,turnY-1,W,1.5);ctx.fillRect(0,turnY+6,W,1.5);}
      else{ctx.fillStyle='#e8e7e0';ctx.fillRect(0,turnY,W,6);ctx.fillStyle=C.tB;ctx.fillRect(0,turnY-1,W,1.5);ctx.fillRect(0,turnY+6,W,1.5);}
      // Row 4-6: パネル上段 + 盤面 + パネル下段
      topH=turnY+8;const panelRowH=fs*2.8;const bubbleRowH=fs*2;
      const boardTop=topH+bubbleRowH+panelRowH+fs*0.3;const boardBot=H-panelRowH-bubbleRowH-fs*1;this._bubbleTopY=topH;this._bubbleBotY=boardBot+panelRowH+fs*0.3;
      const bPx=Math.min(eW,boardBot-boardTop);
      this.cs=bPx/BS;this.ox=(W-bPx)/2;this.oy=boardTop;
      const pnl=this._calcPlayerPos(W,H,fs);ppW=pnl.pw;ppH=pnl.ph;
    }else{
      // === デスクトップ: 従来の4隅レイアウト ===
      topH=fs*4.5;barH=fs*2;const barP2=(topH-barH)/2;const bArea=H-topH;
      const sidePanel=fs*3.5;const bPx=Math.min(eW-sidePanel*2,bArea*0.85);
      this.cs=bPx/BS;this.ox=(W-bPx)/2;this.oy=topH+(bArea-bPx)/2;
      const pnl=this._calcPlayerPos(W,H,fs);ppW=pnl.pw;ppH=pnl.ph;
      this.ren.splatBar(lox,barP2,eW,barH,this.bd,false,this.tm.swap);
      const hmX=2,hmY=barP2+barH+fs*0.1,hmW=fs*1.5,hmH=fs*0.9;
      hovFx(ctx,hmX,hmY,hmW,hmH);
      tt(ctx,'🏠',hmX+hmW/2,hmY+hmH/2,`${fs*(isHov(hmX,hmY,hmW,hmH)?0.7:0.6)}px sans-serif`,isHov(hmX,hmY,hmW,hmH)?'rgba(255,255,255,0.95)':'rgba(255,255,255,0.7)');
      this.btns.push({id:'home',x:hmX,y:hmY,w:hmW,h:hmH});
      const spdX=W-fs*2,spdY=hmY;const spW=fs*1.8,spH=hmH;
      rr(ctx,spdX,spdY,spW,spH,5);ctx.fillStyle=C.pan;ctx.fill();hovFx(ctx,spdX,spdY,spW,spH);
      const spdTxt=this.tm.spd>=8?'⚡':`×${this.tm.spd}`;
      tt(ctx,spdTxt,spdX+spW/2,spdY+spH/2,`bold ${fs*0.5}px sans-serif`,isHov(spdX,spdY,spW,spH)?C.txt:C.gold);
      this.btns.push({id:'spd',x:spdX,y:spdY,w:spW,h:spH});
      if(isBlackTurn){ctx.fillStyle='#1a1a1a';ctx.fillRect(0,topH-6,W,6);ctx.fillStyle=C.tA;ctx.fillRect(0,topH-7,W,1.5);ctx.fillRect(0,topH,W,1.5);}
      else{ctx.fillStyle='#e8e7e0';ctx.fillRect(0,topH-6,W,6);ctx.fillStyle=C.tB;ctx.fillRect(0,topH-7,W,1.5);ctx.fillRect(0,topH,W,1.5);}
    }

    // === 4隅プレイヤーパネル ===
    const ps=this.tm.ps;const curP=this.tm.cp;
    const humanCount=ps.filter(p=>!p.isCPU).length;
    const swap=this.tm.swap;
    const curTeam=this.tm.team; // 現在のチーム（'A' or 'B'）
    const tm=this.tm;
    for(let i=0;i<ps.length;i++){
      const isAct=curP&&ps[i]===curP&&(ph===PH.PS||ph===PH.PC||ph===PH.PR);
      const isYou=humanCount===1&&!ps[i].isCPU;
      const sCol=ps[i].team==='A'?(swap?WHITE:BLACK):(swap?BLACK:WHITE);
      const pCol=sCol===BLACK?C.tA:C.tB;
      // チームの番かどうか（ゲーム進行中のみ）
      const isTeamTurn=ps[i].team===curTeam&&ph!==PH.GO&&ph!==PH.ST;
      // 選択完了（このターンで既に手を打った）
      const tPs=tm.tPs;
      const isDone=isTeamTurn&&!isAct&&((tm.pi===1&&tPs[0]===ps[i])||(ph===PH.RV||ph===PH.AN||ph===PH.TE));
      this._drawPlayer(ctx,ps[i],this.pPos[i],ppW,ppH,fs,isAct,pCol,isYou,sCol,isTeamTurn,isDone);
    }

    if(this.tm.showB){
      let sx=0,sy=0;
      if(this.shakeT>0){const el=performance.now()-this.shakeT;if(el<500){const i2=(1-el/500)*8;sx=Math.sin(el*0.05)*i2;sy=Math.cos(el*0.07)*i2;}else this.shakeT=0;}
      const showVM=ph===PH.PS||ph===PH.PC;
      this.ren.board(this.bd,this.ox+sx,this.oy+sy,this.cs,{
        vm:showVM?this.tm.vmS||this.tm.vm:null,
        coopM:showVM?this.tm.coopS:null,
        sel:this.tm.sel,
        // revealは飛行完了後にのみ表示（700ms=飛行時間）
        reveal:(ph===PH.RV&&this.tm.revT&&performance.now()-this.tm.revT>700)?this.tm.rev:null,
        anims:this.tm.anims,ac:this.tm.anims.map(a=>[a.r,a.c]),
        flipPreview:(ph===PH.PC&&this.tm.sel)?this.bd.flips(this.tm.sel[0],this.tm.sel[1],this.tm.tCol):null,
      });
      // 仮置きアイコン
      if(ph===PH.PC&&this.tm.sel){
        const[sr,sc]=this.tm.sel;const alpha=0.4+0.3*Math.sin(performance.now()/300); // 黄丸と同じ周期
        ctx.globalAlpha=alpha;tt(ctx,this.tm.cp?.icon||'',this.ox+sc*this.cs+this.cs/2,this.oy+sr*this.cs+this.cs/2,`${this.cs*0.55}px sans-serif`,C.txt);ctx.globalAlpha=1;
      }
      // 石飛行アニメ描画
      this._drawFlyAnims(ctx,fs);
    }else{
      ctx.fillStyle=C.ov;ctx.fillRect(0,topH,W,H-topH);
      const cp2=this.tm.tPs[this.tm.pi];
      if(cp2){tt(ctx,cp2.icon,cx,H*0.35,`${fs*3}px sans-serif`,C.txt);
        tt(ctx,T('handoff',{name:cp2.name}),cx,H*0.35+fs*2.5,`bold ${fs*1}px sans-serif`,C.txt);
        tt(ctx,T('tapContinue'),cx,H*0.35+fs*3.8,`${fs*0.5}px sans-serif`,C.sub);}
    }

    // リビール演出
    if(ph===PH.RV){
      // アイコン飛行（常に表示）
      this._drawRevealFly(ctx,fs);
      // かぶり時だけパネル表示（フェードイン）
      if(this.tm.dup&&this.tm.bMsg){
        // 衝突マスの近くに表示（dupCにセル座標あり）
        const dc=this.tm.dupC;
        const bcx=dc?this.ox+dc.cell[1]*this.cs+this.cs/2:cx;
        const bcy0=dc?this.oy+dc.cell[0]*this.cs+this.cs/2:this.oy+this.cs*BS/2;
        const bcy=Math.min(Math.max(bcy0+this.cs*0.8,this.oy+this.cs),this.oy+this.cs*(BS-1));
        const sinceLand=performance.now()-this.tm.revT-700;
        const revEl=sinceLand<0?0:Math.min(1,sinceLand/200);
        ctx.save();ctx.globalAlpha=revEl;
        const panW2=Math.min(ppW*2,fs*7);
        const dupStone=this.tm.tCol;
        const dupBorder=dupStone===BLACK?'rgba(180,50,40,0.8)':'rgba(60,140,190,0.8)';
        ctx.fillStyle='rgba(0,0,0,0.75)';rr(ctx,bcx-panW2/2,bcy-fs*1,panW2,fs*2.2,12);ctx.fill();
        ctx.strokeStyle=dupBorder;ctx.lineWidth=2.5;ctx.stroke();
        tt(ctx,this.tm.bMsg,bcx,bcy-fs*0.15,`bold ${fs*0.65}px sans-serif`,C.txt);
        tt(ctx,this.tm.bSub,bcx,bcy+fs*0.5,`${fs*0.5}px sans-serif`,C.goldL);
        ctx.restore();
      }
    }

    // 吹き出し（4隅プレイヤーから）
    const now2=performance.now();
    // 吹き出し描画（フェードアウト完了したものは自動除去）
    this.tm.bubs=this.tm.bubs.filter(bb=>{
      const el=now2-this.tm.revT-(bb.delay||0);
      if(el<0)return true; // まだ表示前
      if(el>2800)return false; // フェードアウト完了→除去
      this._bubble(ctx,W,H,bb,fs);return true;
    });

    // 開始演出（画面中央）
    if(ph===PH.ST&&this.tm.startMsg){
      ctx.fillStyle='rgba(10,30,15,0.6)';ctx.fillRect(0,0,W,H);
      tt(ctx,this.tm.msg,cx,this.oy+this.cs*BS/2,`bold ${fs*2}px sans-serif`,C.gold);
    }
    // 「打って！」「考え中…」等をアクティブプレイヤーのパネル付近に表示
    if(ph!==PH.GO&&ph!==PH.RV&&ph!==PH.HO&&ph!==PH.PC&&ph!==PH.ST&&this.tm.msg&&curP){
      const pi2=ps.indexOf(curP);const pp2=this.pPos[pi2];
      if(pp2){
        const isTop2=pp2.y<this.oy+this.cs*BS/2;
        const isYou2=humanCount===1&&!curP.isCPU;
        // 「あなた」ラベルと被らないようにずらす
        const msgY2=mob?(isTop2?this._bubbleTopY+fs*0.7:this._bubbleBotY+fs*0.7):(isTop2?pp2.y+ppH+fs*0.5:pp2.y-(isYou2?fs*1.1:fs*0.6));
        const msgX2=cx;tt(ctx,this.tm.msg,msgX2,msgY2,`bold ${fs*0.55}px sans-serif`,C.gold,'center','middle',W-16);
      }
    }
    if(ph===PH.PC&&curP){
      if(mob){
        const bw=Math.min(eW*0.55,220),bh=Math.max(fs*2,52);
        const bSz2=this.cs*BS,by2=this.oy+bSz2+fs*3.5;
        if(this.tm.sub)tt(ctx,this.tm.sub,cx,by2-fs*0.3,`${fs*0.5}px sans-serif`,C.gold);
        const btnY3=by2+fs*0.3;
        drawBtn(ctx,T('confirmQ'),cx-bw/2,btnY3,bw,bh,'#2d9e5f','#fff');this.btns.push({id:'ok',x:cx-bw/2,y:btnY3,w:bw,h:bh});
        tt(ctx,T('confirmHint'),cx,btnY3+bh+fs*0.5,`${fs*0.45}px sans-serif`,C.sub);
      }else{
        const pi=ps.indexOf(curP);const pp=this.pPos[pi];
        if(pp){const bw=Math.min(ppW*1.2,fs*3.5),bh=Math.max(fs*1.1,30);const bx=pp.x+(ppW-bw)/2;const by2=pp.y+ppH+fs*0.6;
        if(this.tm.sub)tt(ctx,this.tm.sub,pp.x+ppW/2,by2,`${fs*0.4}px sans-serif`,C.gold);
        const btnY3=by2+fs*0.35;
        drawBtn(ctx,T('confirmQ'),bx,btnY3,bw,bh,'#2d9e5f','#fff');this.btns.push({id:'ok',x:bx,y:btnY3,w:bw,h:bh});
        tt(ctx,T('confirmHint'),pp.x+ppW/2,btnY3+bh+fs*0.3,`${fs*0.3}px sans-serif`,C.sub);}
      }
    }
    if(ph===PH.GO){
      if(!this.vicT)this.vicT=performance.now();const el=Math.min(1,(performance.now()-this.vicT)/600);
      const tc=this.tm.teamCnt();
      const w=tc.a>tc.b?'A':tc.b>tc.a?'B':null;
      const tpA=ps.filter(p=>p.team==='A'),tpB=ps.filter(p=>p.team==='B');
      const iA=tpA[0]?.icon||'⚫',iB=tpB[0]?.icon||'⚪';
      const wStone=w==='A'?(this.tm.swap?WHITE:BLACK):(this.tm.swap?BLACK:WHITE);
      const stoneLabel=wStone===BLACK?'●':'○';
      const winTxt=w?T('teamWin',{s:stoneLabel}):T('draw');
      // 背景パネル
      const panW=eW*0.8,panH=fs*6,panX=cx-panW/2,panY=H*0.2;
      ctx.save();
      ctx.globalAlpha=el;
      rr(ctx,panX,panY,panW,panH,16);
      ctx.fillStyle=wStone===BLACK?'rgba(20,20,20,0.85)':'rgba(245,244,238,0.9)';ctx.fill();
      ctx.strokeStyle=wStone===BLACK?C.tA:C.tB;ctx.lineWidth=3;ctx.stroke();
      // 勝者チームアイコン（グロー付き）
      const winIcons=w==='A'?[tpA[0]?.icon,tpA[1]?.icon]:[tpB[0]?.icon,tpB[1]?.icon];
      const glowCol=wStone===BLACK?C.tA:C.tB;
      ctx.shadowColor=glowCol;ctx.shadowBlur=20;
      tt(ctx,winIcons[0]||'',cx-fs*1.5,panY+fs*1.5,`${fs*1.8}px sans-serif`,C.txt);
      tt(ctx,winIcons[1]||'',cx+fs*1.5,panY+fs*1.5,`${fs*1.8}px sans-serif`,C.txt);
      ctx.shadowBlur=0;
      // テキスト（文字色はパネルに合わせてコントラスト確保）
      const txtCol=wStone===BLACK?'#f0efe8':'#1a1a1a';
      tt(ctx,winTxt,cx,panY+fs*3.3,`bold ${fs*1.2}px sans-serif`,txtCol);
      tt(ctx,`${iA} ${tc.a} - ${tc.b} ${iB}`,cx,panY+fs*4.7,`bold ${fs*0.9}px sans-serif`,C.gold);
      ctx.restore();
      const bw2=Math.min(eW*0.5,220),bh2=Math.max(fs*1.8,40);
      const btnY2=panY+panH+fs*0.8;
      drawBtn(ctx,T('toResult'),cx-bw2/2,btnY2,bw2,bh2);this.btns.push({id:'res',x:cx-bw2/2,y:btnY2,w:bw2,h:bh2});
    }
    // チュートリアル吹き出し
    this._drawTutorial(ctx,W,H,cx,fs,ph);
  }

  // チュートリアルがアクティブか（ゲーム進行を止めるべきか）
  get tutActive(){return this.tut.show&&!!this.tut.msg;}

  _tutTrigger(ph){
    if(!this.tut.show)return;
    const t=this.tut;const tm=this.tm;
    if(t.msg)return; // 表示中は新規トリガーしない
    if(!t.intro&&tm.turnNum===0&&ph!==PH.ST){
      t.msg='tut1';t.spots=null;t.intro=true;
    }else if(!t.playShown&&ph===PH.PS&&!tm.cp?.isCPU){
      // 合法手マスをスポットライト
      const spots=(tm.vmS||tm.vm).map(([r,c])=>({x:this.ox+c*this.cs+this.cs/2,y:this.oy+r*this.cs+this.cs/2,r:this.cs*0.45}));
      t.msg='tut2';t.spots=spots;t.playShown=true;
    }else if(!t.rescueSeen&&tm.isRescue&&ph===PH.PS&&!tm.cp?.isCPU){
      const spots=(tm.vmS||tm.vm).map(([r,c])=>({x:this.ox+c*this.cs+this.cs/2,y:this.oy+r*this.cs+this.cs/2,r:this.cs*0.45}));
      t.msg='tutRescue';t.spots=spots;t.rescueSeen=true;
    }else if(!t.coopSeen&&tm.coopS&&tm.coopS.length>0&&ph===PH.PS&&!tm.cp?.isCPU){
      const spots=tm.coopS.map(([r,c])=>({x:this.ox+c*this.cs+this.cs/2,y:this.oy+r*this.cs+this.cs/2,r:this.cs*0.45}));
      t.msg='tutCoop';t.spots=spots;t.coopSeen=true;
    }else if(!t.dupSeen&&tm.dup&&ph===PH.RV){
      const[r,c]=tm.p1;
      t.msg='tutDup';t.spots=[{x:this.ox+c*this.cs+this.cs/2,y:this.oy+r*this.cs+this.cs/2,r:this.cs*0.6}];t.dupSeen=true;
    }
    if(t.msg)t.t=performance.now();
  }

  _drawTutorial(ctx,W,H,cx,fs,ph){
    this._tutTrigger(ph);
    if(!this.tut.show||!this.tut.msg)return;
    const t=this.tut;const now=performance.now();
    const elapsed=now-t.t;
    const fadeIn=Math.min(1,elapsed/300);

    // 濃い半透明オーバーレイ + スポットライト（clip方式）
    ctx.save();ctx.globalAlpha=fadeIn*0.85;
    if(t.spots&&t.spots.length>0){
      // 隣接スポットをグループ化（枠の重なり防止）
      const pad=0;
      const cs2=this.cs||30;
      const grid=new Set();const spotMap=new Map();
      for(const s of t.spots){
        const c=Math.round((s.x-this.ox)/cs2-0.5),r=Math.round((s.y-this.oy)/cs2-0.5);
        const k=`${r},${c}`;grid.add(k);spotMap.set(k,s);
      }
      const visited=new Set();const groups=[];
      for(const key of grid){if(visited.has(key))continue;
        const[r0,c0]=key.split(',').map(Number);const group=[];const q=[[r0,c0]];visited.add(key);
        while(q.length){const[r,c]=q.shift();group.push([r,c]);
          for(const[dr,dc]of[[0,1],[0,-1],[1,0],[-1,0]]){const nk=`${r+dr},${c+dc}`;
            if(grid.has(nk)&&!visited.has(nk)){visited.add(nk);q.push([r+dr,c+dc]);}}}
        groups.push(group);
      }
      // クリップ: 隣接セル間はpadなし（evenodd重なり防止）
      ctx.beginPath();ctx.rect(0,0,W,H);
      for(const key of grid){
        const[r,c]=key.split(',').map(Number);
        const pT=grid.has(`${r-1},${c}`)?0:pad, pB=grid.has(`${r+1},${c}`)?0:pad;
        const pL=grid.has(`${r},${c-1}`)?0:pad, pR=grid.has(`${r},${c+1}`)?0:pad;
        ctx.rect(this.ox+c*cs2-pL, this.oy+r*cs2-pT, cs2+pL+pR, cs2+pT+pB);
      }
      ctx.fillStyle='rgba(0,0,0,1)';ctx.fill('evenodd');
      // グロー枠（クリップ穴と同じ座標で外周辺のみ描画）
      ctx.globalAlpha=fadeIn*(0.5+0.3*Math.sin(performance.now()/300));
      for(const g of groups){
        const gSet=new Set(g.map(([r,c])=>`${r},${c}`));
        ctx.beginPath();
        for(const[r,c]of g){
          const pT=gSet.has(`${r-1},${c}`)?0:pad,pB=gSet.has(`${r+1},${c}`)?0:pad;
          const pL=gSet.has(`${r},${c-1}`)?0:pad,pR=gSet.has(`${r},${c+1}`)?0:pad;
          const x=this.ox+c*cs2-pL,y=this.oy+r*cs2-pT,w=cs2+pL+pR,h=cs2+pT+pB;
          if(!gSet.has(`${r-1},${c}`)){ctx.moveTo(x,y);ctx.lineTo(x+w,y);}
          if(!gSet.has(`${r+1},${c}`)){ctx.moveTo(x,y+h);ctx.lineTo(x+w,y+h);}
          if(!gSet.has(`${r},${c-1}`)){ctx.moveTo(x,y);ctx.lineTo(x,y+h);}
          if(!gSet.has(`${r},${c+1}`)){ctx.moveTo(x+w,y);ctx.lineTo(x+w,y+h);}
        }
        ctx.strokeStyle=C.gold;ctx.lineWidth=3;ctx.stroke();
      }
    }else{
      ctx.fillStyle='rgba(0,0,0,1)';ctx.fillRect(0,0,W,H);
    }
    ctx.restore();

    // テキストパネル（スポットの近くに配置）
    const lines=T(t.msg).split('\n');
    const panH=fs*(1.2+lines.length*0.85);
    const panW=Math.min(W*0.75,fs*16);
    // 位置: スポットがあればその下、なければ盤面中央
    let panY;
    if(t.spots&&t.spots.length>0){
      const maxY=Math.max(...t.spots.map(s=>s.y+s.r));
      panY=Math.min(maxY+fs*0.5,H-panH-fs);
    }else{
      panY=this.oy+this.cs*BS/2-panH/2;
    }
    const panX=cx-panW/2;
    ctx.save();ctx.globalAlpha=fadeIn;
    rr(ctx,panX,panY,panW,panH,12);
    ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fill();
    for(let i=0;i<lines.length;i++){
      tt(ctx,lines[i],cx,panY+fs*0.8+i*fs*0.8,`bold ${fs*0.6}px sans-serif`,'#fff');
    }
    // ▼点滅（タップで進む）
    const blink=Math.sin(now/300)>0?1:0.3;
    ctx.globalAlpha=fadeIn*blink;
    tt(ctx,'▼',cx,panY+panH-fs*0.3,`${fs*0.5}px sans-serif`,C.gold);
    ctx.restore();
  }

  _tutDismiss(){
    if(!this.tut.msg)return false;
    this.tut.msg=null;this.tut.spots=null;this.tut.t=0;
    // 全部見たらフラグ
    if(this.tut.intro&&this.tut.playShown){window._tutSeen=true;}
    return true;
  }

  // リビール時: 2つのアイコンが角から盤面のマスに飛んでくる
  _drawRevealFly(ctx,fs){
    const tm=this.tm;if(!tm.p1)return;
    const elapsed=performance.now()-tm.revT;
    const dur=700; // 飛行時間（少し長めで溜め感）
    const t=Math.min(1,elapsed/dur);
    const tp=tm.tPs;
    const bSz=this.cs*BS;
    const curve=eiFly(t); // 溜めて→ストン

    // 飛行軌道計算（カーブ＋フェイント対応）
    const flyPos=(fromX,fromY,toX,toY,amp,feint)=>{
      let tgtX=toX,tgtY=toY;
      if(feint){
        // 前半40%はフェイント先に向かう、後半で本命に急旋回
        const fX=this.ox+feint[1]*this.cs+this.cs/2;
        const fY=this.oy+feint[0]*this.cs+this.cs/2;
        const blend=Math.min(1,t/0.4); // 0→1（40%で切り替え完了）
        const sw=blend*blend; // ease-in で滑らかに切り替え
        tgtX=fX+(toX-fX)*sw;
        tgtY=fY+(toY-fY)*sw;
      }
      const lx=fromX+(tgtX-fromX)*curve;
      const ly=fromY+(tgtY-fromY)*curve;
      const dx=tgtX-fromX,dy=tgtY-fromY;
      const len=Math.sqrt(dx*dx+dy*dy)||1;
      const nx=-dy/len,ny=dx/len;
      const bulge=Math.sin(t*Math.PI)*amp;
      return[lx+nx*bulge,ly+ny*bulge];
    };

    // P1
    const p1Idx=tm.ps.indexOf(tp[0]);
    const p1Pos=this.pPos[p1Idx];
    if(p1Pos){
      const fromX=p1Pos.x+fs*1.6,fromY=p1Pos.y+fs*1;
      const toX=this.ox+tm.p1[1]*this.cs+this.cs/2;
      const toY=this.oy+tm.p1[0]*this.cs+this.cs/2;
      const[cx2,cy2]=flyPos(fromX,fromY,toX,toY,tm.flyCurve1||0,tm.flyFeint1);
      const iconSz=this.cs*0.6*(0.5+t*0.5);
      ctx.globalAlpha=Math.min(1,t*3);
      tt(ctx,tp[0].icon,cx2,cy2,`${iconSz}px sans-serif`,C.txt);
      ctx.globalAlpha=1;
    }

    // P2（かぶりでなければ）
    if(!tm.dup&&tm.p2){
      const p2Idx=tm.ps.indexOf(tp[1]);
      const p2Pos=this.pPos[p2Idx];
      if(p2Pos){
        const fromX=p2Pos.x+fs*1.6,fromY=p2Pos.y+fs*1;
        const toX=this.ox+tm.p2[1]*this.cs+this.cs/2;
        const toY=this.oy+tm.p2[0]*this.cs+this.cs/2;
        const[cx2,cy2]=flyPos(fromX,fromY,toX,toY,tm.flyCurve2||0,tm.flyFeint2);
        const iconSz=this.cs*0.6*(0.5+t*0.5);
        ctx.globalAlpha=Math.min(1,t*3);
        tt(ctx,tp[1].icon,cx2,cy2,`${iconSz}px sans-serif`,C.txt);
        ctx.globalAlpha=1;
      }
    }else if(tm.dup&&tm.p2){
      // かぶり: 両方のアイコンが同じマスに向かって飛ぶ
      const p2Idx=tm.ps.indexOf(tp[1]);
      const p2Pos=this.pPos[p2Idx];
      if(p2Pos){
        const fromX=p2Pos.x+fs*1.6,fromY=p2Pos.y+fs*1;
        const toX=this.ox+tm.p1[1]*this.cs+this.cs/2;
        const toY=this.oy+tm.p1[0]*this.cs+this.cs/2;
        if(t<1){
          const[cx2,cy2]=flyPos(fromX,fromY,toX,toY,tm.flyCurve2||0,tm.flyFeint2);
          const iconSz=this.cs*0.6*(0.5+t*0.5);
          ctx.globalAlpha=Math.min(1,t*3);
          tt(ctx,tp[1].icon,cx2,cy2,`${iconSz}px sans-serif`,C.txt);
          ctx.globalAlpha=1;
        }else{
          // 到着後: 💥（パネルと同時に出る）
          tt(ctx,'💥',toX,toY,`${this.cs*0.8}px sans-serif`,C.txt);
        }
      }
    }
  }

  _drawFlyAnims(ctx,fs){
    const now=performance.now();
    this.flyAnims=this.flyAnims.filter(a=>!a.done);
    for(const a of this.flyAnims){
      const elapsed=now-a.startTime;if(elapsed<0)continue;
      const t=Math.min(1,elapsed/a.duration);
      const pos=this.pPos[a.pi];if(!pos)continue;
      const fromX=pos.x+fs*1,fromY=pos.y+fs*0.9;
      const toX=this.ox+a.tc*this.cs+this.cs/2;
      const toY=this.oy+a.tr*this.cs+this.cs/2;
      const cx2=fromX+(toX-fromX)*eo(t);
      const cy2=fromY+(toY-fromY)*eo(t);
      const sr=this.cs*0.35*eo(t);
      this.ren.stone(cx2,cy2,sr,a.color);
      if(t>=1)a.done=true;
    }
  }

  _bubble(ctx,W,H,bb,fs){
    const pos=this.pPos[bb.corner%4];
    if(!pos)return;
    // フェードイン/アウト計算
    const elapsed=performance.now()-this.tm.revT-(bb.delay||0);
    if(elapsed<0)return;
    const fadeIn=Math.min(1,elapsed/200); // 200msフェードイン
    const life=15000; // 次のアクションまで長く表示
    const fadeOut=elapsed>life?Math.max(0,1-(elapsed-life)/300):1; // 300msフェードアウト
    const alpha=fadeIn*fadeOut;
    if(alpha<=0)return;

    const{pw:ppW2,ph:ppH2}=this._calcPlayerPos(W,H,fs);
    const pw=Math.min(W*0.3,fs*7),ph2=fs*1.6;
    const bSz=this.cs*BS;
    const isTop=pos.y<this.oy+bSz/2;
    // パネル基準: 上段→パネルの上、下段→パネルの下
    const px=Math.max(4,Math.min(pos.x+(ppW2-pw)/2,W-pw-4));
    const py=this._bubbleTopY!=null&&(W<500)?( isTop?this._bubbleTopY+fs*0.3:this._bubbleBotY+fs*0.2 ):( isTop?pos.y-ph2-fs*0.2:pos.y+ppH2+fs*0.2 );
    const p=this.tm.ps[bb.corner%4];
    const swap=this.tm.swap;
    const isBlack=p?(p.team==='A'?(swap?false:true):(swap?true:false)):true;
    ctx.save();ctx.globalAlpha=alpha;
    const bgCol=isBlack?'rgba(140,45,40,0.85)':'rgba(50,120,160,0.85)';
    const borderCol=isBlack?'rgba(200,80,70,0.5)':'rgba(100,180,220,0.5)';
    // 上段キャラ→下から上へ、下段キャラ→上から下へ浮き上がる
    // 上段: 下から上へ（最初は下にずれてて上に移動）、下段: 上から下へ
    const floatDir=isTop?1:-1;
    const floatY=py+floatDir*(1-fadeIn)*fs*0.5;
    rr(ctx,px,floatY,pw,ph2,10);ctx.fillStyle=bgCol;ctx.fill();
    ctx.strokeStyle=borderCol;ctx.lineWidth=1.5;ctx.stroke();
    tt(ctx,bb.text,px+pw/2,floatY+ph2/2,`bold ${fs*0.5}px sans-serif`,'#fff','center','middle',pw-8);
    ctx.restore();
  }
  update(now){
    // チュートリアル表示中はゲーム進行を止める（autoタイマーも停止）
    if(this.tutActive){if(this.tm.at){clearTimeout(this.tm.at);this.tm.at=null;this.tm._autoDeferred=true;}return;}
    // チュートリアル解除後にautoを再開（ただしphaseが既に進行中なら不要）
    if(this.tm._autoDeferred){this.tm._autoDeferred=false;
      if(this.tm.phase===PH.ST||this.tm.phase===PH.TE||this.tm.phase===PH.PA)this.tm.auto(300);}
    const rd=this.tm.spd>=8?150:this.tm.dup?Math.max(1500,1500/this.tm.spd):1200/Math.max(1,this.tm.spd);
    if(this.tm.phase===PH.RV&&now-this.tm.revT>rd){if(this.tm.dup)this.shakeT=now;this.tm.execPlace();}
    if(this.tm.phase===PH.AN)this.tm.updateAnim(now);
  }
  handleTap(tx,ty){
    // ホーム遷移確認オーバーレイ
    if(this._homeConfirm){
      ctx.fillStyle='rgba(80,80,80,0.85)';ctx.fillRect(0,0,W,H);
      const dlgW=Math.min(eW*0.8,320),dlgH=fs*7,dlgX=cx-dlgW/2,dlgY=H/2-dlgH/2;
      rr(ctx,dlgX,dlgY,dlgW,dlgH,12);ctx.fillStyle='#2a2a2a';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.stroke();
      tt(ctx,T('homeConfirm'),cx,dlgY+fs*1.5,`bold ${fs*0.7}px sans-serif`,'#fff');
      tt(ctx,T('homeConfirmSub'),cx,dlgY+fs*2.5,`${fs*0.5}px sans-serif`,C.sub);
      const btnW2=dlgW*0.35,btnH2=fs*1.5,btnY2=dlgY+dlgH-fs*2.3,gap4=fs*0.4;
      drawBtn(ctx,T('homeYes'),cx-btnW2-gap4/2,btnY2,btnW2,btnH2,'#c04040','#fff');
      this.btns.push({id:'homeYes',x:cx-btnW2-gap4/2,y:btnY2,w:btnW2,h:btnH2});
      drawBtn(ctx,T('homeNo'),cx+gap4/2,btnY2,btnW2,btnH2,'#2d9e5f','#fff');
      this.btns.push({id:'homeNo',x:cx+gap4/2,y:btnY2,w:btnW2,h:btnH2});
    }
    // チュートリアル表示中: タップで閉じる（ゲーム操作を無視）
    if(this._homeConfirm){for(const b of this.btns){if(!hit(tx,ty,b.x,b.y,b.w,b.h))continue;if(b.id==='homeYes'){this.app.showTitle();return;}if(b.id==='homeNo'){this._homeConfirm=false;return;}}return;}
    if(this._tutDismiss())return;
    for(const b of this.btns){if(!hit(tx,ty,b.x,b.y,b.w,b.h))continue;
      if(b.id==='ok'){this.tm.confirm();return;}if(b.id==='ng'){this.tm.cancel();return;}
      if(b.id==='res'){this.app.showResult(this.bd,this.tm.log,this.tm.hist,this.tm.bds,this.tm.ps,this.tm.swap);return;}
      if(b.id==='home'){this._homeConfirm=true;return;}if(b.id==='homeYes'){this.app.showTitle();return;}if(b.id==='homeNo'){this._homeConfirm=false;return;}
      if(b.id==='spd'){const v=[0.5,1,2,4,8];const ci=v.indexOf(this.tm.spd);this.tm.spd=v[(ci+1)%v.length];return;}
      return;}
    if(this.tm.phase===PH.GO)return;
    const col=Math.floor((tx-this.ox)/this.cs),row=Math.floor((ty-this.oy)/this.cs);
    if(row>=0&&row<BS&&col>=0&&col<BS)this.tm.tap(row,col,true);else this.tm.tap(0,0,false);
  }
}

// §9 ResultScreen
class ResultScreen{
  constructor(app,bd,log,hist,bds,ps,swap=false){
    this.app=app;this.bd=bd;this.log=log;this.hist=hist;this.bds=bds;this.ps=ps;this.swap=swap;
    this.ren=new R(app.ctx);this.btns=[];this.ri=-1;this.ga=null;this.sa=null;
    this.playing=false;this.pt=null;this.dragging=false;
  }
  draw(ctx,W,H){
    ctx.fillStyle=battleBg(this.bd,this.swap,true);ctx.fillRect(0,0,W,H);this.btns=[];
    const{eW,ox:lox,cx,fs}=L(W,H);
    const cn=this.bd.cnt();
    const scoreA=this.swap?cn.w:cn.b, scoreB=this.swap?cn.b:cn.w;
    const w=scoreA>scoreB?'A':scoreB>scoreA?'B':null;let y=H*0.04;
    // 背景が明るいか暗いかで文字色を切り替え
    const wStone=w==='A'?(this.swap?WHITE:BLACK):(this.swap?BLACK:WHITE);
    const light=w?(wStone===WHITE):false; // 白チーム勝利=明るい背景
    const fgMain=light?'#1a1a1a':'#f0efe8';
    const fgSub=light?'rgba(30,30,30,0.5)':'rgba(240,239,232,0.5)';
    const panBg=light?'rgba(0,0,0,0.12)':'rgba(0,0,0,0.25)';
    const sliderTrack=light?'rgba(0,0,0,0.12)':'rgba(255,255,255,0.1)';

    const tpA=this.ps.filter(p=>p.team==='A'),tpB=this.ps.filter(p=>p.team==='B');
    const iA=tpA[0]?.icon||'⚫',iB=tpB[0]?.icon||'⚪';

    const stoneLabel2=w?(wStone===BLACK?'●':'○'):'';
    const wTxt=w?T('teamWin',{s:stoneLabel2}):T('draw');
    tt(ctx,wTxt,cx,y,`bold ${fs*1.3}px sans-serif`,w?(wStone===BLACK?C.tA:C.tB):fgMain);y+=fs*1.8;

    // スコア
    tt(ctx,`${iA} ${scoreA} - ${scoreB} ${iB}`,cx,y,`bold ${fs*0.9}px sans-serif`,C.gold);y+=fs*1.2;

    // スプラバー
    const rNumPad=W<500?fs*0.8:0;
    this.ren.splatBar(lox+rNumPad,y,eW-rNumPad*2,fs*1.2,this.bd,true,this.swap);y+=fs*2.5;

    // 統計データ計算
    const dupA=this.log.filter(t=>t.dup&&t.team==='A').length;
    const dupB=this.log.filter(t=>t.dup&&t.team==='B').length;
    const total=this.log.length;
    // 角: 最終盤面で実際に角にある石をカウント（最大4）
    const colA=this.swap?WHITE:BLACK,colB=this.swap?BLACK:WHITE;
    let cornA=0,cornB=0;
    for(const[r,c]of[[0,0],[0,7],[7,0],[7,7]]){const v=this.bd.get(r,c);if(v===colA)cornA++;else if(v===colB)cornB++;}

    // グラフ（中央揃え）+ 凡例は右側
    const legendW=fs*3;
    const graphW=eW*0.75;
    const graphOx=cx-graphW/2;
    if(this.hist.length>1){const gh=H*0.14;this._graph(ctx,graphOx,y,graphW,gh,fs,light,fgSub);this.ga={x:graphOx,y,w:graphW,h:gh};
      const lgX=graphOx+graphW+fs*0.5,lgY=y+gh*0.3;
      tt(ctx,'★',lgX,lgY,`bold ${fs*0.5}px sans-serif`,C.gold,'left');
      tt(ctx,'Corner',lgX+fs*0.6,lgY,`${fs*0.45}px sans-serif`,fgSub,'left');
      tt(ctx,'💥',lgX,lgY+fs*0.65,`${fs*0.45}px sans-serif`,fgMain,'left');
      tt(ctx,'Dup',lgX+fs*0.6,lgY+fs*0.65,`${fs*0.45}px sans-serif`,fgSub,'left');
      y+=gh+fs*1.0;
    }

    // スライダー（中央揃え）
    const slW=graphW,slH=fs*0.7,slX=graphOx;
    this.sa={x:slX,y,w:slW,h:slH*2};
    rr(ctx,slX,y+slH*0.35,slW,slH*0.3,slH*0.15);ctx.fillStyle=light?'rgba(0,0,0,0.12)':'rgba(255,255,255,0.1)';ctx.fill();
    if(this.bds.length>1){const idx=this.ri>=0?this.ri:this.bds.length-1;const kx=slX+(idx/(this.bds.length-1))*slW;
      const knobR=slH*(isHov(slX-15,y-10,slW+30,slH*3)?0.65:0.5);
      ctx.beginPath();ctx.arc(kx,y+slH*0.5,knobR,0,Math.PI*2);ctx.fillStyle=C.gold;ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();}
    const pbX=slX+slW+fs*0.4,pbY=y,pbW=fs*1.5,pbH=slH*2;
    hovFx(ctx,pbX,pbY,pbW,pbH);
    const pbHov=isHov(pbX,pbY,pbW,pbH);
    tt(ctx,this.playing?'⏸':'▶️',pbX+pbW/2,y+slH*0.5,`${fs*(pbHov?0.8:0.65)}px sans-serif`,pbHov?C.gold:fgMain);
    this.btns.push({id:'play',x:pbX,y:pbY,w:pbW,h:pbH});
    y+=slH*2.5;

    // 盤面（中央）＋ ●統計（左）＋ ○統計（右）
    const dBd=this.ri>=0&&this.ri<this.bds.length?this.bds[this.ri]:this.bd;
    const mSz=Math.min(W<500?eW*0.45:eW*0.35,H*0.22);const mCs=mSz/BS;
    const mOx=cx-mSz/2;
    let hlCells=null,flipCells=null;
    if(this.ri>=1&&this.ri<this.bds.length){
      const prev=this.bds[this.ri-1];hlCells=[];flipCells=[];
      for(let r=0;r<BS;r++)for(let c=0;c<BS;c++){
        const cur=dBd.get(r,c),prv=prev.get(r,c);
        if(cur!==EMPTY&&prv===EMPTY)hlCells.push([r,c]);
        else if(cur!==EMPTY&&prv!==EMPTY&&cur!==prv)flipCells.push([r,c]);
      }
    }
    this.ren.board(dBd,mOx,y,mCs,{hlCells,flipCells});

    // ターン表示（盤面の上中央）
    const dBdCn=dBd.cnt();
    const curIdx=this.ri>=0?this.ri:this.bds.length-1;
    const dScoreA=this.swap?dBdCn.w:dBdCn.b, dScoreB=this.swap?dBdCn.b:dBdCn.w;
    const dTotal=dScoreA+dScoreB+(dBdCn.e||0);
    const pctA=dTotal?Math.round(dScoreA/dTotal*100):0;
    const pctB=dTotal?Math.round(dScoreB/dTotal*100):0;
    tt(ctx,`${curIdx} / ${total}`,cx,y-fs*0.5,`bold ${fs*0.55}px sans-serif`,C.gold);

    // かぶり・角を現在ターンまでの累計で計算
    const logsUpTo=this.log.slice(0,curIdx);
    const curDupA=logsUpTo.filter(t=>t.dup&&t.team==='A').length;
    const curDupB=logsUpTo.filter(t=>t.dup&&t.team==='B').length;
    // 角: 現在盤面で実際に角にある石
    let curCornA=0,curCornB=0;
    for(const[r,c]of[[0,0],[0,7],[7,0],[7,7]]){const v=dBd.get(r,c);if(v===colA)curCornA++;else if(v===colB)curCornB++;}

    // ●チーム統計（盤面の左、中央揃え）
    const stLX=mOx-fs*1.2;let stLY=y+fs*0.3;
    this.ren.stone(stLX,stLY,fs*0.35,this.swap?WHITE:BLACK);
    stLY+=fs*0.7;
    tt(ctx,`${dScoreA}`,stLX,stLY,`bold ${fs*0.6}px sans-serif`,fgMain);stLY+=fs*0.5;
    tt(ctx,`${pctA}%`,stLX,stLY,`${fs*0.5}px sans-serif`,fgSub);stLY+=fs*0.7;
    tt(ctx,T('dupCount',{n:curDupA}),stLX,stLY,`${fs*0.5}px sans-serif`,fgSub);stLY+=fs*0.55;
    tt(ctx,T('cornerCount',{n:curCornA}),stLX,stLY,`${fs*0.5}px sans-serif`,fgSub);

    // ○チーム統計（盤面の右、中央揃え）
    const stRX=mOx+mSz+fs*1.2;let stRY=y+fs*0.3;
    this.ren.stone(stRX,stRY,fs*0.35,this.swap?BLACK:WHITE);
    stRY+=fs*0.7;
    tt(ctx,`${dScoreB}`,stRX,stRY,`bold ${fs*0.6}px sans-serif`,fgMain);stRY+=fs*0.5;
    tt(ctx,`${pctB}%`,stRX,stRY,`${fs*0.5}px sans-serif`,fgSub);stRY+=fs*0.7;
    tt(ctx,T('dupCount',{n:curDupB}),stRX,stRY,`${fs*0.5}px sans-serif`,fgSub);stRY+=fs*0.55;
    tt(ctx,T('cornerCount',{n:curCornB}),stRX,stRY,`${fs*0.5}px sans-serif`,fgSub);

    y+=mSz+fs*0.8;

    // ボタン
    const bw2=Math.min(eW*0.38,160),bh2=Math.max(fs*1.6,38),gap2=fs*0.5;
    drawBtn(ctx,T('retry'),cx-bw2-gap2/2,y,bw2,bh2);this.btns.push({id:'retry',x:cx-bw2-gap2/2,y,w:bw2,h:bh2});
    const homeBg=light?'rgba(0,0,0,0.1)':'rgba(255,255,255,0.15)';
    const homeTxt=light?'#333':'#eee';
    drawBtn(ctx,T('home'),cx+gap2/2,y,bw2,bh2,homeBg,homeTxt);this.btns.push({id:'home',x:cx+gap2/2,y,w:bw2,h:bh2});
  }

  _graph(ctx,x,y,w,h,fs,light=false,fgSub='rgba(240,239,232,0.5)'){
    const hist=this.hist;
    const graphH=h;
    rr(ctx,x,y,w,graphH,6);ctx.fillStyle=light?'rgba(0,0,0,0.08)':'rgba(0,0,0,0.25)';ctx.fill();
    ctx.strokeStyle=light?'rgba(0,0,0,0.15)':'rgba(255,255,255,0.1)';ctx.lineWidth=1;ctx.stroke();
    const p=6,gx=x+p,gy=y+p,gw=w-p*2,gh=graphH-p*2;
    // 50%ライン
    ctx.strokeStyle=light?'rgba(0,0,0,0.1)':'rgba(255,255,255,0.12)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(gx,gy+gh/2);ctx.lineTo(gx+gw,gy+gh/2);ctx.stroke();ctx.setLineDash([]);
    if(hist.length<2)return;
    const step=gw/(hist.length-1);
    // エリア塗り: スプラバーの色に合わせる（黒=barB色、白=barW色）
    // エリア塗り: スプラバーと同じ不透明な白黒
    ctx.beginPath();ctx.moveTo(gx,gy+gh);for(let i=0;i<hist.length;i++){const h2=hist[i],t=h2.b+h2.w,r=t?h2.b/t:0.5;ctx.lineTo(gx+i*step,gy+gh*(1-r));}ctx.lineTo(gx+(hist.length-1)*step,gy+gh);ctx.closePath();ctx.fillStyle=C.barB;ctx.fill();
    ctx.beginPath();ctx.moveTo(gx,gy);for(let i=0;i<hist.length;i++){const h2=hist[i],t=h2.b+h2.w,r=t?h2.b/t:0.5;ctx.lineTo(gx+i*step,gy+gh*(1-r));}ctx.lineTo(gx+(hist.length-1)*step,gy);ctx.closePath();ctx.fillStyle=C.barW;ctx.fill();
    // ライン
    ctx.beginPath();ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;for(let i=0;i<hist.length;i++){const h2=hist[i],t=h2.b+h2.w,r=t?h2.b/t:0.5;const px2=gx+i*step,py=gy+gh*(1-r);i===0?ctx.moveTo(px2,py):ctx.lineTo(px2,py);}ctx.stroke();
    // イベントマーカー
    for(let i=0;i<hist.length;i++){const h2=hist[i],t=h2.b+h2.w,r=t?h2.b/t:0.5;const px2=gx+i*step,py=gy+gh*(1-r);
      // チームAのイベント=上側、チームB=下側にオフセット
      const above=h2.team==='A'?-1:1;
      const hasCorner=h2.ev?.includes('角'),hasDupe=h2.ev?.includes('かぶり');
      const both=hasCorner&&hasDupe;
      if(hasCorner)tt(ctx,'★',px2+(both?-fs*0.15:0),py+above*fs*0.35,`bold ${fs*0.35}px sans-serif`,C.gold);
      if(hasDupe)tt(ctx,'💥',px2+(both?fs*0.15:0),py+above*fs*0.35,`${fs*0.3}px sans-serif`,'#fff');}
    // リプレイ位置インジケーター（黄色丸）
    if(this.ri>=0&&this.ri<hist.length){const h2=hist[this.ri],t=h2.b+h2.w,r=t?h2.b/t:0.5;const px2=gx+this.ri*step,py=gy+gh*(1-r);
      ctx.beginPath();ctx.arc(px2,py,5,0,Math.PI*2);ctx.fillStyle=C.gold;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();}
  }

  handleTap(tx,ty){
    // スライダー
    if(this.sa&&this.bds.length>1&&hit(tx,ty,this.sa.x-15,this.sa.y-10,this.sa.w+30,this.sa.h+20)){
      const r=Math.max(0,Math.min(1,(tx-this.sa.x)/this.sa.w));this.ri=Math.round(r*(this.bds.length-1));this.playing=false;return;}
    // グラフ
    if(this.ga&&this.hist.length>1&&hit(tx,ty,this.ga.x,this.ga.y,this.ga.w,this.ga.h)){
      const r=(tx-this.ga.x)/this.ga.w;this.ri=Math.max(0,Math.min(this.hist.length-1,Math.round(r*(this.hist.length-1))));return;}
    for(const b of this.btns){if(!hit(tx,ty,b.x,b.y,b.w,b.h))continue;
      if(b.id==='retry'){this.app.restart();return;}if(b.id==='home'){this.app.showTitle();return;}
      if(b.id==='play'){this._togglePlay();return;}return;}
  }
  handleMove(tx,ty){
    if(this.sa&&this.bds.length>1&&this.dragging){
      const r=Math.max(0,Math.min(1,(tx-this.sa.x)/this.sa.w));this.ri=Math.round(r*(this.bds.length-1));}
  }
  handleDown(tx,ty){if(this.sa&&hit(tx,ty,this.sa.x-15,this.sa.y-10,this.sa.w+30,this.sa.h+20))this.dragging=true;}
  handleUp(){this.dragging=false;}
  _togglePlay(){if(this.playing){this.playing=false;if(this.pt)clearInterval(this.pt);return;}
    this.playing=true;if(this.ri<0||this.ri>=this.bds.length-1)this.ri=0;
    this.pt=setInterval(()=>{if(this.ri>=this.bds.length-1){this.playing=false;clearInterval(this.pt);return;}this.ri++;},500);}
}

// §10 PlayerCountScreen — 初回起動時の人数選択
class PlayerCountScreen{
  constructor(app){this.app=app;this.btns=[];}
  draw(ctx,W,H){
    const t=(Math.sin(performance.now()/2000)+1)/2;
    const mix=(a,b,r)=>Math.round(a+(b-a)*r);
    ctx.fillStyle=`rgb(${mix(C.bgA[0],C.bgB[0],t)},${mix(C.bgA[1],C.bgB[1],t)},${mix(C.bgA[2],C.bgB[2],t)})`;
    ctx.fillRect(0,0,W,H);this.btns=[];
    const{eW,cx,fs}=L(W,H);
    // テキスト色: 背景が白(t=1)→黒文字、背景が黒(t=0)→白文字
    const fm=Math.round(240-(240-26)*t);
    const fgMain=`rgb(${fm},${fm},${fm})`;
    let y=H*0.2;
    tt(ctx,'Synchronized',cx,y,`bold ${fs*1.2}px sans-serif`,C.gold);y+=fs*1.3;
    tt(ctx,'Reversi',cx,y,`bold ${fs*1.6}px sans-serif`,fgMain);y+=fs*3;
    tt(ctx,T('howMany'),cx,y,`bold ${fs*0.9}px sans-serif`,fgMain);y+=fs*1.2;
    const icons=[
      '１ 🙋💻💻💻',
      '２ 🙋🙋💻💻',
      '３ 🙋🙋🙋💻',
      '４ 🙋🙋🙋🙋',
    ];
    const bw=Math.min(eW*0.6,280),bh=Math.max(fs*1.8,44);
    for(let i=0;i<4;i++){
      const by=y+i*(bh+fs*0.5);
      drawBtn(ctx,icons[i],cx-bw/2,by,bw,bh,'#3a3a3a','#f0efe8');
      this.btns.push({id:i+1,x:cx-bw/2,y:by,w:bw,h:bh});
    }
    // 言語切替（右上）
    const lbX=W-fs*2.5,lbY=fs*0.3,lbW=fs*2,lbH=fs*0.7;
    rr(ctx,lbX,lbY,lbW,lbH,4);
    const lbH2=isHov(lbX,lbY,lbW,lbH);
    ctx.fillStyle=lbH2?'rgba(255,255,255,0.15)':'rgba(255,255,255,0.05)';ctx.fill();
    ctx.strokeStyle=lbH2?C.gold:fgMain;ctx.lineWidth=1;ctx.stroke();
    tt(ctx,LANG==='ja'?'EN':'JA',lbX+lbW/2,lbY+lbH/2,`${lbH2?'bold ':''}${fs*0.35}px sans-serif`,lbH2?C.gold:fgMain);
    this.btns.push({id:'lang',x:lbX,y:lbY,w:lbW,h:lbH});
  }
  handleTap(tx,ty){
    for(const b of this.btns){if(!hit(tx,ty,b.x,b.y,b.w,b.h))continue;
      if(b.id==='lang'){LANG=LANG==='ja'?'en':'ja';return;}
      this.app.setupPlayers(b.id);return;}
  }
}

// §11 GameApp
class GameApp{
  constructor(){
    this.canvas=document.getElementById('gameCanvas');this.ctx=this.canvas.getContext('2d');this.W=0;this.H=0;this.scr=null;this.ts=null;this.lg=null;this.lastWinStone=null;
    this.hoverX=-1;this.hoverY=-1;this.pressing=false;
    this.resize();window.addEventListener('resize',()=>this.resize());
    this.canvas.addEventListener('pointerdown',(e)=>{e.preventDefault();const[x,y]=this._xy(e);this.pressing=true;this.hoverX=x;this.hoverY=y;if(this.scr?.handleDown)this.scr.handleDown(x,y);if(this.scr?.handleTap)this.scr.handleTap(x,y);});
    this.canvas.addEventListener('pointermove',(e)=>{const[x,y]=this._xy(e);this.hoverX=x;this.hoverY=y;if(this.scr?.handleMove)this.scr.handleMove(x,y);});
    this.canvas.addEventListener('pointerup',()=>{this.pressing=false;if(this.scr?.handleUp)this.scr.handleUp();});
    this.scr=new PlayerCountScreen(this);this.loop();
  }
  _xy(e){const r=this.canvas.getBoundingClientRect();return[(e.clientX-r.left)*(this.W/r.width),(e.clientY-r.top)*(this.H/r.height)];}
  resize(){const d=window.devicePixelRatio||1;this.W=window.innerWidth;this.H=window.innerHeight;this.canvas.width=this.W*d;this.canvas.height=this.H*d;this.canvas.style.width=this.W+'px';this.canvas.style.height=this.H+'px';this.ctx.setTransform(d,0,0,d,0,0);}
  showTitle(){this.scr=new TitleScreen(this,this.ts);}
  setupPlayers(humanCount){
    // humanCount人を4枠にランダムに割り当て
    const slots=[0,1,2,3];
    // シャッフル
    for(let i=slots.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[slots[i],slots[j]]=[slots[j],slots[i]];}
    const humanSlots=new Set(slots.slice(0,humanCount));
    // TitleScreenを作ってisCPUを設定
    this.showTitle();
    const ts=this.scr;
    for(let i=0;i<4;i++)ts.ps[i].isCPU=!humanSlots.has(i);
  }
  startGame(ps,lay,swap,spd){
    const scr=this.scr;this.ts={ps:ps.map(p=>({...p})),li:LKEYS.indexOf(lay),swap,spd,pA:scr?.pA??0,pB:scr?.pB??1};
    const players=ps.map(p=>({...p,color:swap?(p.team==='A'?WHITE:BLACK):(p.team==='A'?BLACK:WHITE)}));
    this.lg={ps,lay,swap,spd};this.scr=new GameScreen(this,players,lay,spd,swap);
  }
  restart(){if(this.lg){const g=this.lg;this.startGame(g.ps,g.lay,g.swap,g.spd);}else this.showTitle();}
  showResult(bd,log,hist,bds,ps,swap){
    const cn=bd.cnt();const sA=swap?cn.w:cn.b,sB=swap?cn.b:cn.w;
    this.lastWinStone=sA>sB?(swap?WHITE:BLACK):sB>sA?(swap?BLACK:WHITE):null;
    this.scr=new ResultScreen(this,bd,log,hist,bds,ps,swap);
  }
  loop(){const now=performance.now();this.ctx.clearRect(0,0,this.W,this.H);if(this.scr){this.scr.draw?.(this.ctx,this.W,this.H);this.scr.update?.(now);}requestAnimationFrame(()=>this.loop());}
}
window._app=new GameApp();
</script>
